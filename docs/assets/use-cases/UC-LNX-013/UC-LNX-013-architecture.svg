<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">013 Package Repository Management architecture</title>
<desc id="desc">Control where software comes from, how it is signed and which source wins resolution. The flow moves from reviewed source and approval through IaC execution to runtime validation, convergence and recovery evidence.</desc>
<defs>
<style>
.bg{fill:#ffffff}.frame{fill:#f8fafc;stroke:#2563eb;stroke-width:3}.zone{fill:#ffffff;stroke:#60a5fa;stroke-width:2.5;stroke-dasharray:9 7}.title{font:700 32px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.zoneTitle{font:700 22px Arial,sans-serif;fill:#0f172a}.boxTitle{font:700 18px Arial,sans-serif;fill:#111827}.boxSub{font:14px Arial,sans-serif;fill:#475569}.amber{fill:#fffbeb;stroke:#b45309;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.purple{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.red{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.green{fill:#ecfdf5;stroke:#15803d;stroke-width:2}.flow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.feedback{stroke:#15803d;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#greenArrow)}.controlTitle{font:700 18px Arial,sans-serif;fill:#0f172a}.control{font:700 15px Arial,sans-serif;fill:#1e3a8a}
</style>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#2563eb"/></marker>
<marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#15803d"/></marker>
</defs>
<rect class="bg" width="1600" height="980"/>
<text class="title" x="50" y="58">013 — Package Repository Management</text>
<text class="subtitle" x="50" y="92">Control where software comes from, how it is signed and which source wins resolution.</text>
<rect class="frame" x="35" y="125" width="1530" height="650" rx="14"/>
<rect class="zone" x="60" y="160" width="440" height="570" rx="14"/>
