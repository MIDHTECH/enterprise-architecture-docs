<text class="boxSub" x="624" y="446">compare candidate packages</text>
<rect class="green" x="600" y="530" width="400" height="92" rx="12"/>
<text class="boxTitle" x="624" y="568">Cohort rollout</text>
<text class="boxSub" x="624" y="596">disable only retired sources</text>
