<text class="zoneTitle" x="86" y="202">Source and approval</text>
<text class="zoneTitle" x="606" y="202">IaC execution</text>
<text class="zoneTitle" x="1126" y="202">Runtime and evidence</text>
<rect class="amber" x="80" y="230" width="400" height="92" rx="12"/>
<text class="boxTitle" x="104" y="268">Repository catalog</text>
<text class="boxSub" x="104" y="296">owner, URL, key, priority, expiry</text>
<rect class="blue" x="80" y="380" width="400" height="92" rx="12"/>
<text class="boxTitle" x="104" y="418">Source validation</text>
<text class="boxSub" x="104" y="446">TLS, GPG and metadata checks</text>
<rect class="purple" x="80" y="530" width="400" height="92" rx="12"/>
<text class="boxTitle" x="104" y="568">Change approval</text>
<text class="boxSub" x="104" y="596">package impact review</text>
<rect class="red" x="600" y="230" width="400" height="92" rx="12"/>
<text class="boxTitle" x="624" y="268">Ansible repos</text>
<text class="boxSub" x="624" y="296">files, keys, pins and module streams</text>
