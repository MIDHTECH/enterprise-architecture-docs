<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-DB-002" data-archetype="delivery-pipeline">
<title id="title">UC-DB-002 PostgreSQL Installation Through AWX architecture</title><desc id="desc">UC-DB-002 PostgreSQL Installation Through AWX shown as a delivery-pipeline with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accentPanel{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.3}.card{fill:#fff;stroke:#64748b;stroke-width:1.8}.accentCard{fill:#fff;stroke:#7c3aed;stroke-width:2.4}.goodCard{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warnCard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.darkCard{fill:#0f172a;stroke:#0f172a;stroke-width:2}.mainTitle{font:700 30px Arial,sans-serif;fill:#0f172a}.kicker{font:700 12px Arial,sans-serif;fill:#7c3aed;letter-spacing:1.2px}.quote{font:20px Arial,sans-serif;fill:#334155}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.sectionSub{font:12px Arial,sans-serif;fill:#64748b}.cardTitle{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.inverseTitle{font:700 15px Arial,sans-serif;fill:#fff}.inverseBody{font:12px Arial,sans-serif;fill:#e2e8f0}.badge{fill:#7c3aed}.badgeText{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#arrow)}.thinArrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.feedback{stroke:#ea580c;stroke-width:2.7;stroke-dasharray:8 6;fill:none;marker-end:url(#orangeArrow)}.label{fill:#fff;opacity:.94}.edgeText{font:10.5px Arial,sans-serif;fill:#334155}.lane{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.decision{fill:#fff;stroke:#7c3aed;stroke-width:2.5}.small{font:11px Arial,sans-serif;fill:#64748b}.note{font:italic 14px Georgia,serif;fill:#475569}.hub{fill:#7c3aed;stroke:#7c3aed;stroke-width:2}.hubTitle{font:700 18px Arial,sans-serif;fill:#fff}.hubBody{font:12px Arial,sans-serif;fill:#fff}.zone{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.nodeCircle{fill:#fff;stroke:#7c3aed;stroke-width:2.3}.nodeTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.nodeBody{font:11px Arial,sans-serif;fill:#475569}
</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#7c3aed"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-DB-002 — PostgreSQL Installation Through AWX</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Versioned and repeatable installation</tspan></text>
<rect class="accentPanel" x="45" y="160" width="1710" height="115" rx="15"/><text class="section" x="70" y="195">The people and promise behind the pipeline</text><text class="body" x="70" y="220" text-anchor="start"><tspan x="70" dy="0">Enterprise Database Engineering and Reliability Platform team</tspan></text><text class="cardTitle" x="650" y="195" text-anchor="start"><tspan x="650" dy="0">Starts when</tspan></text><text class="body" x="650" y="220" text-anchor="start"><tspan x="650" dy="0">Merge request, protected scheduled evaluation, approved</tspan><tspan x="650" dy="16">operator request, source/data event, or monitored…</tspan></text><text class="cardTitle" x="1210" y="195" text-anchor="start"><tspan x="1210" dy="0">Change boundary</tspan></text><text class="body" x="1210" y="220" text-anchor="start"><tspan x="1210" dy="0">Required before any mutating or runtime action; not required for</tspan><tspan x="1210" dy="16">fixture-only CI</tspan></text>
<text class="section" x="70" y="325">From reviewed intent to an outcome someone can trust</text><text class="sectionSub" x="70" y="347">Each handoff has a clear reason to exist; a failed gate stops the line.</text><rect class="card" x="70" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="99" cy="414" r="17"/><text class="badgeText" x="99" y="419" text-anchor="middle">1</text><text class="cardTitle" x="128" y="415" text-anchor="start"><tspan x="128" dy="0">Backup, schema or</tspan><tspan x="128" dy="17">change</tspan></text><text class="body" x="88" y="453" text-anchor="start"><tspan x="88" dy="0">midhhealth/data-and-</tspan><tspan x="88" dy="16">integration/database-</tspan><tspan x="88" dy="16">reliability-platform</tspan></text><rect class="card" x="340" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="369" cy="414" r="17"/><text class="badgeText" x="369" y="419" text-anchor="middle">2</text><text class="cardTitle" x="398" y="415" text-anchor="start"><tspan x="398" dy="0">Database safety</tspan><tspan x="398" dy="17">contract</tspan></text><text class="body" x="358" y="453" text-anchor="start"><tspan x="358" dy="0">UC-LNX-010 • UC-GOV-002 •</tspan><tspan x="358" dy="16">UC-OBS-010 • UC-RSO-015</tspan></text><rect class="accentCard" x="610" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="639" cy="414" r="17"/><text class="badgeText" x="639" y="419" text-anchor="middle">3</text><text class="cardTitle" x="668" y="415" text-anchor="start"><tspan x="668" dy="0">Validate, restore</tspan><tspan x="668" dy="17">and measure</tspan></text><text class="body" x="628" y="453" text-anchor="start"><tspan x="628" dy="0">Versioned and repeatable</tspan><tspan x="628" dy="16">installation</tspan></text><rect class="accentCard" x="880" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="909" cy="414" r="17"/><text class="badgeText" x="909" y="419" text-anchor="middle">4</text><text class="cardTitle" x="938" y="415" text-anchor="start"><tspan x="938" dy="0">Approved AWX /</tspan><tspan x="938" dy="17">PostgreSQL path</tspan></text><text class="body" x="898" y="453" text-anchor="start"><tspan x="898" dy="0">database engineer,</tspan><tspan x="898" dy="16">application owner, SRE,</tspan><tspan x="898" dy="16">security reviewer, and…</tspan></text><rect class="card" x="1150" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="1179" cy="414" r="17"/><text class="badgeText" x="1179" y="419" text-anchor="middle">5</text><text class="cardTitle" x="1208" y="415" text-anchor="start"><tspan x="1208" dy="0">Existing PostgreSQL</tspan><tspan x="1208" dy="17">service</tspan></text><text class="body" x="1168" y="453" text-anchor="start"><tspan x="1168" dy="0">existing PostgreSQL</tspan><tspan x="1168" dy="16">service, backup host,</tspan><tspan x="1168" dy="16">MinIO, GitLab, Jenkins…</tspan></text><rect class="goodCard" x="1420" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="1449" cy="414" r="17"/><text class="badgeText" x="1449" y="419" text-anchor="middle">6</text><text class="cardTitle" x="1478" y="415" text-anchor="start"><tspan x="1478" dy="0">Database evidence</tspan></text><text class="body" x="1438" y="453" text-anchor="start"><tspan x="1438" dy="0">The first delivery slice</tspan><tspan x="1438" dy="16">proves Versioned and</tspan><tspan x="1438" dy="16">repeatable installation…</tspan></text><path class="arrow" d="M300 457 L340 457"/><rect class="label" x="299" y="426" width="52" height="20" rx="5"/><text class="edgeText" x="305" y="440">commit</text><path class="arrow" d="M570 457 L610 457"/><rect class="label" x="569" y="426" width="60" height="20" rx="5"/><text class="edgeText" x="575" y="440">contract</text><path class="arrow" d="M840 457 L880 457"/><rect class="label" x="839" y="426" width="60" height="20" rx="5"/><text class="edgeText" x="845" y="440">approved</text><path class="arrow" d="M1110 457 L1150 457"/><rect class="label" x="1109" y="426" width="54" height="20" rx="5"/><text class="edgeText" x="1115" y="440">execute</text><path class="arrow" d="M1380 457 L1420 457"/><rect class="label" x="1379" y="426" width="52" height="20" rx="5"/><text class="edgeText" x="1385" y="440">prove</text><polygon class="decision" points="995,580 1070,645 995,710 920,645"/><text class="cardTitle" x="995" y="637" text-anchor="middle">PROMOTE?</text><text class="small" x="995" y="658" text-anchor="middle">evidence says yes / no</text><path class="thinArrow" d="M1535 530 C1535 645 1070 645 1070 645"/><rect class="label" x="1374" y="614" width="60" height="20" rx="5"/><text class="edgeText" x="1380" y="628">evidence</text>
<rect class="warnCard" x="120" y="610" width="310" height="155" rx="14"/><text class="cardTitle" x="138" y="640" text-anchor="start"><tspan x="138" dy="0">If the line stops</tspan></text><text class="body" x="138" y="678" text-anchor="start"><tspan x="138" dy="0">No quiet bypass. Preserve the</tspan><tspan x="138" dy="16">reason, keep drop temporary state</tspan><tspan x="138" dy="16">/ restore, and return the decision…</tspan></text><path class="feedback" d="M920 645 C760 645 600 688 430 688"/><rect class="label" x="729" y="656" width="52" height="20" rx="5"/><text class="edgeText" x="735" y="670">block</text>
<rect class="card" x="500" y="610" width="340" height="155" rx="14"/><text class="cardTitle" x="518" y="640" text-anchor="start"><tspan x="518" dy="0">Assurance that can veto the</tspan><tspan x="518" dy="17">release</tspan></text><text class="body" x="518" y="678" text-anchor="start"><tspan x="518" dy="0">administrative credentials or row</tspan><tspan x="518" dy="16">content escaping the database control</tspan><tspan x="518" dy="16">boundary</tspan></text><path class="thinArrow" d="M840 687 C875 687 890 665 920 655"/><rect class="label" x="836" y="654" width="120" height="20" rx="5"/><text class="edgeText" x="842" y="668">security / quality</text>
<rect class="goodCard" x="1120" y="610" width="520" height="155" rx="14"/><text class="cardTitle" x="1138" y="640" text-anchor="start"><tspan x="1138" dy="0">What a reviewer should be able to say</tspan></text><text class="body" x="1138" y="678" text-anchor="start"><tspan x="1138" dy="0">I can trace PostgreSQL Installation Through AWX from</tspan><tspan x="1138" dy="16">source revision to target, see why it passed, and</tspan><tspan x="1138" dy="16">understand how to recover</tspan></text>
<path class="lane" d="M70 825 H1640"/><text class="note" x="70" y="858">“Green” means the intended outcome was observed—not merely that a job finished.</text><text class="body" x="70" y="892" text-anchor="start"><tspan x="70" dy="0">PostgreSQL Installation Through AWX defines the guarded database workflow for Versioned and repeatable installation on the existing PostgreSQL boundary</tspan></text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new database server, VM, storage system, database product, or live-data migration</tspan></text></svg>