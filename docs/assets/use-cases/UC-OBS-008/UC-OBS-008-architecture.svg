<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-OBS-008" data-archetype="feedback-loop">
<title id="title">UC-OBS-008 Deployment Health Scoring architecture</title><desc id="desc">UC-OBS-008 Deployment Health Scoring shown as a feedback-loop with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accentPanel{fill:#f0fdfa;stroke:#0f766e;stroke-width:2.3}.card{fill:#fff;stroke:#64748b;stroke-width:1.8}.accentCard{fill:#fff;stroke:#0f766e;stroke-width:2.4}.goodCard{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warnCard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.darkCard{fill:#0f172a;stroke:#0f172a;stroke-width:2}.mainTitle{font:700 30px Arial,sans-serif;fill:#0f172a}.kicker{font:700 12px Arial,sans-serif;fill:#0f766e;letter-spacing:1.2px}.quote{font:20px Arial,sans-serif;fill:#334155}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.sectionSub{font:12px Arial,sans-serif;fill:#64748b}.cardTitle{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.inverseTitle{font:700 15px Arial,sans-serif;fill:#fff}.inverseBody{font:12px Arial,sans-serif;fill:#e2e8f0}.badge{fill:#0f766e}.badgeText{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrow)}.thinArrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.feedback{stroke:#ea580c;stroke-width:2.7;stroke-dasharray:8 6;fill:none;marker-end:url(#orangeArrow)}.label{fill:#fff;opacity:.94}.edgeText{font:10.5px Arial,sans-serif;fill:#334155}.lane{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.decision{fill:#fff;stroke:#0f766e;stroke-width:2.5}.small{font:11px Arial,sans-serif;fill:#64748b}.note{font:italic 14px Georgia,serif;fill:#475569}.hub{fill:#0f766e;stroke:#0f766e;stroke-width:2}.hubTitle{font:700 18px Arial,sans-serif;fill:#fff}.hubBody{font:12px Arial,sans-serif;fill:#fff}.zone{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.nodeCircle{fill:#fff;stroke:#0f766e;stroke-width:2.3}.nodeTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.nodeBody{font:11px Arial,sans-serif;fill:#475569}
</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0f766e"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-OBS-008 — Deployment Health Scoring</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Release health combines latency, errors, restarts, logs, traces and synthetic checks</tspan></text>
<rect class="accentPanel" x="45" y="155" width="1710" height="105" rx="15"/><text class="section" x="70" y="190">A loop with a human decision—not an unattended robot</text><text class="body" x="70" y="217" text-anchor="start"><tspan x="70" dy="0">Deployment Health Scoring turns Release health combines latency, errors, restarts, logs, traces and synthetic checks into an owned operational signal rather</tspan><tspan x="70" dy="16">than an unreviewed dashboard or alert</tspan></text>
<rect class="panel" x="45" y="300" width="350" height="620" rx="18"/><text class="section" x="70" y="338">Who keeps the loop honest</text><rect class="card" x="70" y="375" width="300" height="145" rx="14"/><text class="cardTitle" x="88" y="405" text-anchor="start"><tspan x="88" dy="0">Accountable owner</tspan></text><text class="body" x="88" y="443" text-anchor="start"><tspan x="88" dy="0">Enterprise Observability and SRE</tspan><tspan x="88" dy="16">Reliability Platform team</tspan></text><rect class="warnCard" x="70" y="550" width="300" height="145" rx="14"/><text class="cardTitle" x="88" y="580" text-anchor="start"><tspan x="88" dy="0">What can stop it</tspan></text><text class="body" x="88" y="618" text-anchor="start"><tspan x="88" dy="0">sensitive fields or credentials</tspan><tspan x="88" dy="16">leaking into telemetry and</tspan><tspan x="88" dy="16">diagnostic artifacts</tspan></text><rect class="card" x="70" y="725" width="300" height="145" rx="14"/><text class="cardTitle" x="88" y="755" text-anchor="start"><tspan x="88" dy="0">Where it may look</tspan></text><text class="body" x="88" y="793" text-anchor="start"><tspan x="88" dy="0">existing Prometheus,</tspan><tspan x="88" dy="16">Alertmanager, Grafana, Loki,</tspan><tspan x="88" dy="16">Tempo, OpenTelemetry, Elastic…</tspan></text>
<rect class="accentPanel" x="440" y="300" width="1010" height="620" rx="18"/><text class="section" x="470" y="338">Observe → understand → decide → verify → learn</text>
<circle class="hub" cx="930" cy="590" r="125"/><text class="hubTitle" x="930" y="565" text-anchor="middle"><tspan x="930" dy="0">Deployment Health Scoring</tspan></text><text class="hubBody" x="930" y="635" text-anchor="middle"><tspan x="930" dy="0">Release health combines latency,</tspan><tspan x="930" dy="16">errors, restarts, logs, traces</tspan><tspan x="930" dy="16">and synthetic checks</tspan></text><circle class="nodeCircle" cx="930" cy="325" r="105"/><text class="nodeTitle" x="930" y="310" text-anchor="middle"><tspan x="930" dy="0">Service telemetry</tspan></text><text class="nodeBody" x="930" y="355" text-anchor="middle"><tspan x="930" dy="0">Merge request, protected</tspan><tspan x="930" dy="14">scheduled evaluation,</tspan><tspan x="930" dy="14">approved operator request…</tspan></text><circle class="nodeCircle" cx="1220" cy="455" r="105"/><text class="nodeTitle" x="1220" y="440" text-anchor="middle"><tspan x="1220" dy="0">SLI, rule and</tspan><tspan x="1220" dy="16">ownership</tspan></text><text class="nodeBody" x="1220" y="485" text-anchor="middle"><tspan x="1220" dy="0">UC-OBS-001 • UC-RSO-002 •</tspan><tspan x="1220" dy="14">UC-RSO-003 • UC-CICD-001</tspan></text><circle class="nodeCircle" cx="1120" cy="735" r="105"/><text class="nodeTitle" x="1120" y="720" text-anchor="middle"><tspan x="1120" dy="0">Collect, correlate and</tspan><tspan x="1120" dy="16">evaluate</tspan></text><text class="nodeBody" x="1120" y="765" text-anchor="middle"><tspan x="1120" dy="0">Release health combines</tspan><tspan x="1120" dy="14">latency, errors, restarts,</tspan><tspan x="1120" dy="14">logs, traces and synthetic…</tspan></text><circle class="nodeCircle" cx="740" cy="735" r="105"/><text class="nodeTitle" x="740" y="720" text-anchor="middle"><tspan x="740" dy="0">Incident-ready</tspan><tspan x="740" dy="16">evidence</tspan></text><text class="nodeBody" x="740" y="765" text-anchor="middle"><tspan x="740" dy="0">The first delivery slice</tspan><tspan x="740" dy="14">proves Release health</tspan><tspan x="740" dy="14">combines latency, errors…</tspan></text><circle class="nodeCircle" cx="640" cy="455" r="105"/><text class="nodeTitle" x="640" y="440" text-anchor="middle"><tspan x="640" dy="0">Tune or revert rule</tspan></text><text class="nodeBody" x="640" y="485" text-anchor="middle"><tspan x="640" dy="0">Return the finding to</tspan><tspan x="640" dy="14">Enterprise Observability</tspan><tspan x="640" dy="14">and SRE Reliability…</tspan></text><path class="arrow" d="M930 325 L1220 455"/><rect class="label" x="1069" y="376" width="52" height="20" rx="5"/><text class="edgeText" x="1075" y="390">1</text><path class="arrow" d="M1220 455 L1120 735"/><rect class="label" x="1164" y="581" width="52" height="20" rx="5"/><text class="edgeText" x="1170" y="595">2</text><path class="arrow" d="M1120 735 L740 735"/><rect class="label" x="924" y="721" width="52" height="20" rx="5"/><text class="edgeText" x="930" y="735">3</text><path class="arrow" d="M740 735 L640 455"/><rect class="label" x="684" y="581" width="52" height="20" rx="5"/><text class="edgeText" x="690" y="595">4</text><path class="arrow" d="M640 455 L930 325"/><rect class="label" x="779" y="376" width="52" height="20" rx="5"/><text class="edgeText" x="785" y="390">5</text><path class="thinArrow" d="M825 590 L745 590"/><rect class="label" x="754" y="560" width="54" height="20" rx="5"/><text class="edgeText" x="760" y="574">compare</text><path class="thinArrow" d="M1035 590 L1115 590"/><rect class="label" x="1049" y="560" width="60" height="20" rx="5"/><text class="edgeText" x="1055" y="574">decision</text>
<rect class="panel" x="1495" y="300" width="260" height="620" rx="18"/><text class="section" x="1520" y="338">Reality checks</text><rect class="card" x="1520" y="375" width="210" height="125" rx="14"/><text class="cardTitle" x="1538" y="405" text-anchor="start"><tspan x="1538" dy="0">Source revision</tspan></text><text class="body" x="1538" y="443" text-anchor="start"><tspan x="1538" dy="0">midhhealth/reliability-</tspan><tspan x="1538" dy="16">operations/observabilit</tspan><tspan x="1538" dy="16">y-sre-platform</tspan></text><rect class="warnCard" x="1520" y="525" width="210" height="125" rx="14"/><text class="cardTitle" x="1538" y="555" text-anchor="start"><tspan x="1538" dy="0">Change boundary</tspan></text><text class="body" x="1538" y="593" text-anchor="start"><tspan x="1538" dy="0">Required before any</tspan><tspan x="1538" dy="16">mutating or runtime</tspan><tspan x="1538" dy="16">action; not required…</tspan></text><rect class="goodCard" x="1520" y="675" width="210" height="145" rx="14"/><text class="cardTitle" x="1538" y="705" text-anchor="start"><tspan x="1538" dy="0">Evidence a person</tspan><tspan x="1538" dy="17">can review</tspan></text><text class="body" x="1538" y="743" text-anchor="start"><tspan x="1538" dy="0">The first delivery</tspan><tspan x="1538" dy="16">slice proves Release</tspan><tspan x="1538" dy="16">health combines…</tspan></text>
<path class="thinArrow" d="M1495 735 C1400 735 1370 690 1300 670"/><rect class="label" x="1364" y="702" width="66" height="20" rx="5"/><text class="edgeText" x="1370" y="716">assurance</text><text class="note" x="470" y="970">A healthy loop gets quieter and more accurate over time. It does not simply run more often.</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new monitoring VM, telemetry backend, paging product, or unapproved data source</tspan></text></svg>