<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-CICD-016" data-archetype="delivery-pipeline">
  <title id="title">UC-CICD-016 cross-project release contract validation architecture</title>
  <desc id="desc">A producer change moves through contract normalization, consumer checks, a human-owned compatibility decision, promotion, verification, and recovery while unknown consumers fail closed.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.slate{fill:#fff;stroke:#64748b;stroke-width:2}.dark{fill:#0f172a;stroke:#0f172a;stroke-width:2}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 30px Arial,sans-serif}.kicker{font:700 12px Arial,sans-serif;fill:#2563eb;letter-spacing:1.4px}.h2{font:700 19px Arial,sans-serif}.h3{font:700 15px Arial,sans-serif}.body{font:12px Arial,sans-serif}.small{font:11px Arial,sans-serif}.inverse{fill:#fff}.arrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.back{fill:none;stroke:#ea580c;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#orange)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#gray)}.step{fill:#2563eb}.stepText{font:700 13px Arial,sans-serif;fill:#fff}.diamond{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.note{font:italic 14px Georgia,serif;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#ea580c"/></marker>
    <marker id="gray" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1120"/>
  <text class="title ink" x="48" y="50">UC-CICD-016 — Cross-Project Release Contract Validation</text>
  <text class="kicker" x="48" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text>
  <text class="body muted" x="48" y="116" style="font-size:20px">Independent projects can release quickly without quietly breaking the applications that depend on them.</text>

  <rect class="lane" x="45" y="150" width="1710" height="100" rx="16"/>
  <text class="h2 ink" x="70" y="184">One change, several owners, one attributable decision</text>
  <text class="body muted" x="70" y="212">Automation checks contracts and coverage. Producer and consumer owners still decide migration risk, exception expiry, and recovery.</text>

  <rect class="lane" x="45" y="285" width="250" height="650" rx="18"/>
  <text class="h2 ink" x="70" y="323">People and promises</text>
  <rect class="blue" x="70" y="355" width="200" height="120" rx="12"/>
  <text class="h3 ink" x="88" y="385">Producer owner</text><text class="body muted" x="88" y="412"><tspan x="88">Publishes change, contract,</tspan><tspan x="88" dy="17">migration and rollback intent</tspan></text>
  <rect class="green" x="70" y="500" width="200" height="120" rx="12"/>
  <text class="h3 ink" x="88" y="530">Consumer owners</text><text class="body muted" x="88" y="557"><tspan x="88">Own representative fixtures</tspan><tspan x="88" dy="17">and supported-version claims</tspan></text>
  <rect class="orange" x="70" y="645" width="200" height="120" rx="12"/>
  <text class="h3 ink" x="88" y="675">Release owner</text><text class="body muted" x="88" y="702"><tspan x="88">Accepts migration risk or</tspan><tspan x="88" dy="17">stops before promotion</tspan></text>
  <rect class="slate" x="70" y="790" width="200" height="110" rx="12"/>
  <text class="h3 ink" x="88" y="820">Current boundary</text><text class="body muted" x="88" y="847"><tspan x="88">GitLab runner evidence first;</tspan><tspan x="88" dy="17">Jenkins only after approval</tspan></text>

  <rect class="blue" x="330" y="285" width="1100" height="650" rx="18"/>
  <text class="h2 ink" x="360" y="323">The release conversation expressed as a delivery pipeline</text>

  <circle class="step" cx="390" cy="400" r="22"/><text class="stepText" x="390" y="405" text-anchor="middle">1</text>
  <rect class="slate" x="425" y="350" width="210" height="105" rx="12"/>
  <text class="h3 ink" x="445" y="380">Candidate change</text><text class="body muted" x="445" y="407"><tspan x="445">Producer revision, artifact,</tspan><tspan x="445" dy="16">interface diff, owner</tspan></text>

  <circle class="step" cx="690" cy="400" r="22"/><text class="stepText" x="690" y="405" text-anchor="middle">2</text>
  <rect class="slate" x="725" y="350" width="220" height="105" rx="12"/>
  <text class="h3 ink" x="745" y="380">Normalize contracts</text><text class="body muted" x="745" y="407"><tspan x="745">API • event • migration</tspan><tspan x="745" dy="16">hashes and policy modes</tspan></text>

  <circle class="step" cx="1000" cy="400" r="22"/><text class="stepText" x="1000" y="405" text-anchor="middle">3</text>
  <rect class="slate" x="1035" y="350" width="260" height="105" rx="12"/>
  <text class="h3 ink" x="1055" y="380">Resolve consumers</text><text class="body muted" x="1055" y="407"><tspan x="1055">Known edges • unresolved edges</tspan><tspan x="1055" dy="16">fixture age • owner coverage</tspan></text>

  <path class="arrow" d="M635 402 H720"/><path class="arrow" d="M945 402 H1030"/>

  <rect class="slate" x="430" y="520" width="235" height="125" rx="12"/>
  <text class="h3 ink" x="450" y="550">Consumer A</text><text class="body muted" x="450" y="577"><tspan x="450">Pinned fixture + supported</tspan><tspan x="450" dy="16">contract version</tspan><tspan x="450" dy="16">Result: compatible</tspan></text>
  <rect class="orange" x="705" y="520" width="235" height="125" rx="12"/>
  <text class="h3 ink" x="725" y="550">Consumer B</text><text class="body muted" x="725" y="577"><tspan x="725">Required field removed</tspan><tspan x="725" dy="16">Result: breaking</tspan><tspan x="725" dy="16">Migration required</tspan></text>
  <rect class="orange" x="980" y="520" width="235" height="125" rx="12"/>
  <text class="h3 ink" x="1000" y="550">Unknown edge</text><text class="body muted" x="1000" y="577"><tspan x="1000">Owner or fixture unresolved</tspan><tspan x="1000" dy="16">Result: coverage incomplete</tspan><tspan x="1000" dy="16">Never treated as success</tspan></text>
  <path class="dash" d="M1110 455 C1110 485 548 480 548 515"/><path class="dash" d="M1145 455 C1145 490 823 485 823 515"/><path class="dash" d="M1180 455 C1180 490 1098 485 1098 515"/>

  <polygon class="diamond" points="825,700 955,770 825,840 695,770"/>
  <text class="h3 ink" x="825" y="752" text-anchor="middle">Complete and compatible?</text>
  <text class="small muted" x="825" y="779" text-anchor="middle">all consumers • migration</text>
  <text class="small muted" x="825" y="796" text-anchor="middle">exception • recovery</text>
  <path class="arrow" d="M548 645 C548 700 680 720 710 750"/><path class="arrow" d="M823 645 V695"/><path class="arrow" d="M1098 645 C1098 700 970 720 940 750"/>

  <rect class="green" x="1035" y="720" width="260" height="105" rx="12"/>
  <text class="h3 ink" x="1055" y="750">Promote exact revision</text><text class="body muted" x="1055" y="777"><tspan x="1055">Jenkins consumes report hash</tspan><tspan x="1055" dy="16">then verifies consumer paths</tspan></text>
  <rect class="orange" x="420" y="720" width="230" height="105" rx="12"/>
  <text class="h3 ink" x="440" y="750">Stop and return</text><text class="body muted" x="440" y="777"><tspan x="440">Repair contract, migration,</tspan><tspan x="440" dy="16">fixture or dependency record</tspan></text>
  <path class="arrow" d="M955 770 H1030"/><text class="small muted" x="975" y="755">yes</text>
  <path class="back" d="M695 770 H655"/><text class="small muted" x="665" y="755">no</text>
  <path class="back" d="M535 720 C535 675 410 650 405 455"/>

  <rect class="lane" x="1470" y="285" width="285" height="650" rx="18"/>
  <text class="h2 ink" x="1495" y="323">Evidence that travels</text>
  <rect class="dark" x="1495" y="355" width="235" height="170" rx="12"/>
  <text class="h3 inverse" x="1515" y="385">Compatibility report</text><text class="body inverse" x="1515" y="415"><tspan x="1515">producer + consumers</tspan><tspan x="1515" dy="17">contract and artifact hashes</tspan><tspan x="1515" dy="17">coverage + reason codes</tspan><tspan x="1515" dy="17">migration + exception expiry</tspan><tspan x="1515" dy="17">last-compatible revision</tspan></text>
  <rect class="green" x="1495" y="555" width="235" height="140" rx="12"/>
  <text class="h3 ink" x="1515" y="585">Independent post-check</text><text class="body muted" x="1515" y="612"><tspan x="1515">Consumer journey, target</tspan><tspan x="1515" dy="17">revision, observed behavior</tspan><tspan x="1515" dy="17">and owner decision</tspan></text>
  <rect class="orange" x="1495" y="725" width="235" height="150" rx="12"/>
  <text class="h3 ink" x="1515" y="755">Recovery evidence</text><text class="body muted" x="1515" y="782"><tspan x="1515">Zero-change stop or return</tspan><tspan x="1515" dy="17">to last-compatible revision;</tspan><tspan x="1515" dy="17">no screenshot-only success</tspan></text>
  <path class="arrow" d="M1295 772 H1465"/>

  <text class="note" x="360" y="980">A green producer pipeline is only a local fact. Enterprise safety depends on the consumers we checked—and the ones we could not.</text>
  <rect class="orange" x="45" y="1010" width="1710" height="72" rx="14"/>
  <text class="h3 ink" x="70" y="1040">The line we do not cross in this design</text>
  <text class="body muted" x="70" y="1064">No invented application, hidden consumer, protected-data fixture, new testing product, or runtime promotion without registered owners and separate approval.</text>
</svg>
