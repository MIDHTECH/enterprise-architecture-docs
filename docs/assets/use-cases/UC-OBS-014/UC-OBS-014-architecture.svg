<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0f766e"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-OBS-014 — Change-to-Incident Correlation</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Incidents link to recent commits, deployments, Terraform plans and GitOps syncs</tspan></text>
<rect class="accentPanel" x="45" y="155" width="1710" height="105" rx="15"/><text class="section" x="70" y="190">A response timeline that keeps people, evidence and recovery together</text><text class="body" x="70" y="217" text-anchor="start"><tspan x="70" dy="0">Change-to-Incident Correlation turns Incidents link to recent commits, deployments, Terraform plans and GitOps syncs into an owned operational signal rather</tspan><tspan x="70" dy="16">than an unreviewed dashboard or alert</tspan></text>
<line x1="100" y1="475" x2="1690" y2="475" class="arrow"/><circle class="badge" cx="100" cy="475" r="24"/><text class="badgeText" x="100" y="480" text-anchor="middle">1</text><text class="kicker" x="30" y="339">SIGNAL</text><rect class="card" x="15" y="355" width="190" height="120" rx="14"/><text class="cardTitle" x="33" y="385" text-anchor="start"><tspan x="33" dy="0">Service</tspan><tspan x="33" dy="17">telemetry</tspan></text><text class="body" x="33" y="423" text-anchor="start"><tspan x="33" dy="0">Merge request,</tspan><tspan x="33" dy="16">protected scheduled</tspan><tspan x="33" dy="16">evaluation, approved…</tspan></text><circle class="badge" cx="345" cy="475" r="24"/><text class="badgeText" x="345" y="480" text-anchor="middle">2</text><text class="kicker" x="275" y="519">CLASSIFY</text><rect class="card" x="260" y="535" width="190" height="120" rx="14"/><text class="cardTitle" x="278" y="565" text-anchor="start"><tspan x="278" dy="0">SLI, rule and</tspan><tspan x="278" dy="17">ownership</tspan></text><text class="body" x="278" y="603" text-anchor="start"><tspan x="278" dy="0">UC-RSO-004 • UC-</tspan><tspan x="278" dy="16">RSO-005 • UC-RSO-009</tspan><tspan x="278" dy="16">• UC-RSO-010</tspan></text><circle class="badge" cx="590" cy="475" r="24"/><text class="badgeText" x="590" y="480" text-anchor="middle">3</text><text class="kicker" x="520" y="339">OWN</text><rect class="accentCard" x="505" y="355" width="190" height="120" rx="14"/><text class="cardTitle" x="523" y="385" text-anchor="start"><tspan x="523" dy="0">Enterprise</tspan><tspan x="523" dy="17">Observability…</tspan></text><text class="body" x="523" y="423" text-anchor="start"><tspan x="523" dy="0">SRE, service owner,</tspan><tspan x="523" dy="16">platform engineer,</tspan><tspan x="523" dy="16">incident responder…</tspan></text><circle class="badge" cx="835" cy="475" r="24"/><text class="badgeText" x="835" y="480" text-anchor="middle">4</text><text class="kicker" x="765" y="519">DIAGNOSE</text><rect class="card" x="750" y="535" width="190" height="120" rx="14"/><text class="cardTitle" x="768" y="565" text-anchor="start"><tspan x="768" dy="0">Change-to-</tspan><tspan x="768" dy="17">Incident…</tspan></text><text class="body" x="768" y="603" text-anchor="start"><tspan x="768" dy="0">Incidents link to</tspan><tspan x="768" dy="16">recent commits,</tspan><tspan x="768" dy="16">deployments…</tspan></text><circle class="badge" cx="1080" cy="475" r="24"/><text class="badgeText" x="1080" y="480" text-anchor="middle">5</text><text class="kicker" x="1010" y="339">ACT</text><rect class="accentCard" x="995" y="355" width="190" height="120" rx="14"/><text class="cardTitle" x="1013" y="385" text-anchor="start"><tspan x="1013" dy="0">Existing</tspan><tspan x="1013" dy="17">telemetry…</tspan></text><text class="body" x="1013" y="423" text-anchor="start"><tspan x="1013" dy="0">existing Prometheus,</tspan><tspan x="1013" dy="16">Alertmanager,</tspan><tspan x="1013" dy="16">Grafana, Loki, Tempo…</tspan></text><circle class="badge" cx="1325" cy="475" r="24"/><text class="badgeText" x="1325" y="480" text-anchor="middle">6</text><text class="kicker" x="1255" y="519">VERIFY</text><rect class="goodCard" x="1240" y="535" width="190" height="120" rx="14"/><text class="cardTitle" x="1258" y="565" text-anchor="start"><tspan x="1258" dy="0">Incident-ready</tspan><tspan x="1258" dy="17">evidence</tspan></text><text class="body" x="1258" y="603" text-anchor="start"><tspan x="1258" dy="0">The first delivery</tspan><tspan x="1258" dy="16">slice proves</tspan><tspan x="1258" dy="16">Incidents link to…</tspan></text><circle class="badge" cx="1570" cy="475" r="24"/><text class="badgeText" x="1570" y="480" text-anchor="middle">7</text><text class="kicker" x="1500" y="339">LEARN</text><rect class="card" x="1485" y="355" width="190" height="120" rx="14"/><text class="cardTitle" x="1503" y="385" text-anchor="start"><tspan x="1503" dy="0">Tune or revert</tspan><tspan x="1503" dy="17">rule</tspan></text><text class="body" x="1503" y="423" text-anchor="start"><tspan x="1503" dy="0">Update runbook,</tspan><tspan x="1503" dy="16">ownership, thresholds</tspan><tspan x="1503" dy="16">and follow-up work</tspan></text><rect class="panel" x="70" y="735" width="500" height="220" rx="18"/><text class="section" x="95" y="772">Safety boundary</text><text class="body" x="95" y="807" text-anchor="start"><tspan x="95" dy="0">sensitive fields or credentials leaking into telemetry and</tspan><tspan x="95" dy="18">diagnostic artifacts</tspan></text><text class="body" x="95" y="900" text-anchor="start"><tspan x="95" dy="0">Required before any mutating or runtime action; not</tspan><tspan x="95" dy="17">required for fixture-only CI</tspan></text>
<rect class="panel" x="615" y="735" width="540" height="220" rx="18"/><text class="section" x="640" y="772">Evidence created as the response unfolds</text><text class="body" x="640" y="807" text-anchor="start"><tspan x="640" dy="0">Times, owner, affected target, decision reasons, commands or</tspan><tspan x="640" dy="18">actions, observed recovery and follow-up for Change-to-Incident</tspan><tspan x="640" dy="18">Correlation</tspan></text>
<rect class="panel" x="1200" y="735" width="500" height="220" rx="18"/><text class="section" x="1225" y="772">Recovery closes the incident—not the alert</text><text class="body" x="1225" y="807" text-anchor="start"><tspan x="1225" dy="0">The first delivery slice proves Incidents link to recent</tspan><tspan x="1225" dy="18">commits, deployments, Terraform plans and GitOps syncs on</tspan><tspan x="1225" dy="18">the documented existing target boundary. It uses a</tspan><tspan x="1225" dy="18">versioned contract plus positive, negative, malformed-…</tspan></text>
<path class="thinArrow" d="M1570 655 C1570 690 1450 720 1450 735"/><rect class="label" x="1454" y="684" width="52" height="20" rx="5"/><text class="edgeText" x="1460" y="698">review</text><path class="feedback" d="M1450 955 C1450 995 220 995 220 595"/><rect class="label" x="784" y="968" width="120" height="20" rx="5"/><text class="edgeText" x="790" y="982">feed learning back</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new monitoring VM, telemetry backend, paging product, or unapproved data source</tspan></text></svg>