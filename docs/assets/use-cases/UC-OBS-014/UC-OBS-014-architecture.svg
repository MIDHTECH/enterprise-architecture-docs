<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-OBS-014" data-archetype="response">
<title id="title">UC-OBS-014 Change-to-Incident Correlation architecture</title><desc id="desc">UC-OBS-014 Change-to-Incident Correlation shown as a response with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
