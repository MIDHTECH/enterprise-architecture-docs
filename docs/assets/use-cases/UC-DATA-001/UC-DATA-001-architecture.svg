<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-DATA-001" data-archetype="data-flow">
<title id="title">UC-DATA-001 Healthcare Feed Quality Validation architecture</title><desc id="desc">UC-DATA-001 Healthcare Feed Quality Validation shown as a data-flow with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accentPanel{fill:#ecfdf5;stroke:#059669;stroke-width:2.3}.card{fill:#fff;stroke:#64748b;stroke-width:1.8}.accentCard{fill:#fff;stroke:#059669;stroke-width:2.4}.goodCard{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warnCard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.darkCard{fill:#0f172a;stroke:#0f172a;stroke-width:2}.mainTitle{font:700 30px Arial,sans-serif;fill:#0f172a}.kicker{font:700 12px Arial,sans-serif;fill:#059669;letter-spacing:1.2px}.quote{font:20px Arial,sans-serif;fill:#334155}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.sectionSub{font:12px Arial,sans-serif;fill:#64748b}.cardTitle{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.inverseTitle{font:700 15px Arial,sans-serif;fill:#fff}.inverseBody{font:12px Arial,sans-serif;fill:#e2e8f0}.badge{fill:#059669}.badgeText{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#arrow)}.thinArrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.feedback{stroke:#ea580c;stroke-width:2.7;stroke-dasharray:8 6;fill:none;marker-end:url(#orangeArrow)}.label{fill:#fff;opacity:.94}.edgeText{font:10.5px Arial,sans-serif;fill:#334155}.lane{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.decision{fill:#fff;stroke:#059669;stroke-width:2.5}.small{font:11px Arial,sans-serif;fill:#64748b}.note{font:italic 14px Georgia,serif;fill:#475569}.hub{fill:#059669;stroke:#059669;stroke-width:2}.hubTitle{font:700 18px Arial,sans-serif;fill:#fff}.hubBody{font:12px Arial,sans-serif;fill:#fff}.zone{fill:#ecfdf5;stroke:#059669;stroke-width:2}.nodeCircle{fill:#fff;stroke:#059669;stroke-width:2.3}.nodeTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.nodeBody{font:11px Arial,sans-serif;fill:#475569}
</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#059669"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-DATA-001 — Healthcare Feed Quality Validation</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Detect late, malformed, incomplete, or duplicated healthcare feeds before downstream decisions use them</tspan></text>
<rect class="accentPanel" x="45" y="160" width="1710" height="100" rx="15"/><text class="section" x="70" y="195">The story in plain language</text><text class="body" x="70" y="222" text-anchor="start"><tspan x="70" dy="0">Data engineers need an executable contract for healthcare feed arrival, schema, required fields, uniqueness, and reconciliation. The first slice runs</tspan><tspan x="70" dy="16">entirely in GitLab CI against sanitized synthetic fixtures</tspan></text>
<text class="section" x="65" y="310">Data moves forward; trust is earned at every boundary</text><text class="sectionSub" x="65" y="332">The useful path and the refusal/replay path are both first-class.</text>
<rect class="zone" x="55" y="360" width="300" height="480" rx="18"/><text class="section" x="80" y="397">Where it begins</text><rect class="card" x="80" y="430" width="250" height="145" rx="14"/><text class="cardTitle" x="98" y="460" text-anchor="start"><tspan x="98" dy="0">Producer or source</tspan><tspan x="98" dy="17">data</tspan></text><text class="body" x="98" y="498" text-anchor="start"><tspan x="98" dy="0">Merge request, scheduled</tspan><tspan x="98" dy="16">fixture pipeline, or</tspan><tspan x="98" dy="16">proposed feed-contract…</tspan></text><rect class="card" x="80" y="610" width="250" height="150" rx="14"/><text class="cardTitle" x="98" y="640" text-anchor="start"><tspan x="98" dy="0">People accountable</tspan></text><text class="body" x="98" y="678" text-anchor="start"><tspan x="98" dy="0">request owner, platform</tspan><tspan x="98" dy="16">engineer, reviewer</tspan></text>
<rect class="panel" x="405" y="360" width="310" height="480" rx="18"/><text class="section" x="430" y="397">Make it understandable</text><rect class="accentCard" x="430" y="430" width="260" height="145" rx="14"/><text class="cardTitle" x="448" y="460" text-anchor="start"><tspan x="448" dy="0">Schema and</tspan><tspan x="448" dy="17">classification</tspan></text><text class="body" x="448" y="498" text-anchor="start"><tspan x="448" dy="0">UC-DATA-007 • UC-DATA-015 •</tspan><tspan x="448" dy="16">UC-GOV-004 • UC-OBS-004</tspan></text><rect class="card" x="430" y="610" width="260" height="150" rx="14"/><text class="cardTitle" x="448" y="640" text-anchor="start"><tspan x="448" dy="0">Repository truth</tspan></text><text class="body" x="448" y="678" text-anchor="start"><tspan x="448" dy="0">Existing platform GitLab</tspan><tspan x="448" dy="16">repository</tspan></text>
<rect class="accentPanel" x="765" y="360" width="350" height="480" rx="18"/><text class="section" x="790" y="397">Do the work safely</text><rect class="accentCard" x="790" y="430" width="300" height="145" rx="14"/><text class="cardTitle" x="808" y="460" text-anchor="start"><tspan x="808" dy="0">Ingest, transform and</tspan><tspan x="808" dy="17">validate</tspan></text><text class="body" x="808" y="498" text-anchor="start"><tspan x="808" dy="0">Detect late, malformed,</tspan><tspan x="808" dy="16">incomplete, or duplicated</tspan><tspan x="808" dy="16">healthcare feeds before…</tspan></text><rect class="card" x="790" y="610" width="300" height="150" rx="14"/><text class="cardTitle" x="808" y="640" text-anchor="start"><tspan x="808" dy="0">Existing data execution</tspan><tspan x="808" dy="17">path</tspan></text><text class="body" x="808" y="678" text-anchor="start"><tspan x="808" dy="0">Fixture proof first; runtime use</tspan><tspan x="808" dy="16">remains separately approved</tspan></text>
<rect class="panel" x="1165" y="360" width="300" height="480" rx="18"/><text class="section" x="1190" y="397">Make the result useful</text><rect class="goodCard" x="1190" y="430" width="250" height="145" rx="14"/><text class="cardTitle" x="1208" y="460" text-anchor="start"><tspan x="1208" dy="0">Downstream consumer</tspan></text><text class="body" x="1208" y="498" text-anchor="start"><tspan x="1208" dy="0">Existing data-engineering</tspan><tspan x="1208" dy="16">GitLab project and accepted</tspan><tspan x="1208" dy="16">shared runner; sanitized…</tspan></text><rect class="goodCard" x="1190" y="610" width="250" height="150" rx="14"/><text class="cardTitle" x="1208" y="640" text-anchor="start"><tspan x="1208" dy="0">Counts, quality and</tspan><tspan x="1208" dy="17">lineage</tspan></text><text class="body" x="1208" y="678" text-anchor="start"><tspan x="1208" dy="0">A versioned feed contract</tspan><tspan x="1208" dy="16">and validator accept a good</tspan><tspan x="1208" dy="16">fixture, reject late or…</tspan></text>
<rect class="panel" x="1515" y="360" width="240" height="480" rx="18"/><text class="section" x="1540" y="397">When trust breaks</text><rect class="warnCard" x="1540" y="430" width="190" height="175" rx="14"/><text class="cardTitle" x="1558" y="460" text-anchor="start"><tspan x="1558" dy="0">Replay or</tspan><tspan x="1558" dy="17">reconcile</tspan></text><text class="body" x="1558" y="498" text-anchor="start"><tspan x="1558" dy="0">Quarantine or refuse</tspan><tspan x="1558" dy="16">the bounded item;</tspan><tspan x="1558" dy="16">never widen scope to…</tspan></text><rect class="card" x="1540" y="640" width="190" height="120" rx="14"/><text class="cardTitle" x="1558" y="670" text-anchor="start"><tspan x="1558" dy="0">Owner decision</tspan></text><text class="body" x="1558" y="708" text-anchor="start"><tspan x="1558" dy="0">Data Engineering and</tspan><tspan x="1558" dy="16">Integration team</tspan></text>
<path class="arrow" d="M355 525 L405 525"/><rect class="label" x="354" y="494" width="52" height="20" rx="5"/><text class="edgeText" x="360" y="508">input</text><path class="arrow" d="M715 525 L765 525"/><rect class="label" x="709" y="494" width="60" height="20" rx="5"/><text class="edgeText" x="715" y="508">contract</text><path class="arrow" d="M1115 525 L1165 525"/><rect class="label" x="1109" y="494" width="66" height="20" rx="5"/><text class="edgeText" x="1115" y="508">validated</text><path class="feedback" d="M1465 525 L1515 525"/><rect class="label" x="1459" y="494" width="52" height="20" rx="5"/><text class="edgeText" x="1465" y="508">reject</text><path class="thinArrow" d="M1440 685 C1490 685 1500 700 1540 700"/><rect class="label" x="1459" y="656" width="52" height="20" rx="5"/><text class="edgeText" x="1465" y="670">review</text>
<path class="feedback" d="M1635 605 C1635 910 920 940 920 760"/><rect class="label" x="1104" y="903" width="228" height="20" rx="5"/><text class="edgeText" x="1110" y="917">replay / reconcile only after review</text>
<text class="cardTitle" x="70" y="895">Guardrail</text><text class="body" x="70" y="920" text-anchor="start"><tspan x="70" dy="0">protected or misclassified data entering fixtures, logs, or evidence</tspan></text><text class="note" x="70" y="970">The diagram follows the data, but ownership never disappears into the pipeline.</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">No Kafka, Airflow, lakehouse, VM, database, bucket, or live healthcare integration is created</tspan></text></svg>