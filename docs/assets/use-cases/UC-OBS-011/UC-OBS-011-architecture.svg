<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-OBS-011" data-archetype="delivery-pipeline">
<title id="title">UC-OBS-011 Telemetry Cost Optimization architecture</title><desc id="desc">UC-OBS-011 Telemetry Cost Optimization shown as a delivery-pipeline with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accentPanel{fill:#f0fdfa;stroke:#0f766e;stroke-width:2.3}.card{fill:#fff;stroke:#64748b;stroke-width:1.8}.accentCard{fill:#fff;stroke:#0f766e;stroke-width:2.4}.goodCard{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warnCard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.darkCard{fill:#0f172a;stroke:#0f172a;stroke-width:2}.mainTitle{font:700 30px Arial,sans-serif;fill:#0f172a}.kicker{font:700 12px Arial,sans-serif;fill:#0f766e;letter-spacing:1.2px}.quote{font:20px Arial,sans-serif;fill:#334155}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.sectionSub{font:12px Arial,sans-serif;fill:#64748b}.cardTitle{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.inverseTitle{font:700 15px Arial,sans-serif;fill:#fff}.inverseBody{font:12px Arial,sans-serif;fill:#e2e8f0}.badge{fill:#0f766e}.badgeText{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrow)}.thinArrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.feedback{stroke:#ea580c;stroke-width:2.7;stroke-dasharray:8 6;fill:none;marker-end:url(#orangeArrow)}.label{fill:#fff;opacity:.94}.edgeText{font:10.5px Arial,sans-serif;fill:#334155}.lane{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.decision{fill:#fff;stroke:#0f766e;stroke-width:2.5}.small{font:11px Arial,sans-serif;fill:#64748b}.note{font:italic 14px Georgia,serif;fill:#475569}.hub{fill:#0f766e;stroke:#0f766e;stroke-width:2}.hubTitle{font:700 18px Arial,sans-serif;fill:#fff}.hubBody{font:12px Arial,sans-serif;fill:#fff}.zone{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.nodeCircle{fill:#fff;stroke:#0f766e;stroke-width:2.3}.nodeTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.nodeBody{font:11px Arial,sans-serif;fill:#475569}
</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0f766e"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-OBS-011 — Telemetry Cost Optimization</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Noisy metrics, high-cardinality labels, verbose logs and retention costs are controlled</tspan></text>
<rect class="accentPanel" x="45" y="160" width="1710" height="115" rx="15"/><text class="section" x="70" y="195">The people and promise behind the pipeline</text><text class="body" x="70" y="220" text-anchor="start"><tspan x="70" dy="0">Enterprise Observability and SRE Reliability Platform team</tspan></text><text class="cardTitle" x="650" y="195" text-anchor="start"><tspan x="650" dy="0">Starts when</tspan></text><text class="body" x="650" y="220" text-anchor="start"><tspan x="650" dy="0">Merge request, protected scheduled evaluation, approved</tspan><tspan x="650" dy="16">operator request, source/data event, or monitored…</tspan></text><text class="cardTitle" x="1210" y="195" text-anchor="start"><tspan x="1210" dy="0">Change boundary</tspan></text><text class="body" x="1210" y="220" text-anchor="start"><tspan x="1210" dy="0">Required before any mutating or runtime action; not required for</tspan><tspan x="1210" dy="16">fixture-only CI</tspan></text>
<text class="section" x="70" y="325">From reviewed intent to an outcome someone can trust</text><text class="sectionSub" x="70" y="347">Each handoff has a clear reason to exist; a failed gate stops the line.</text><rect class="card" x="70" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="99" cy="414" r="17"/><text class="badgeText" x="99" y="419" text-anchor="middle">1</text><text class="cardTitle" x="128" y="415" text-anchor="start"><tspan x="128" dy="0">Service telemetry</tspan></text><text class="body" x="88" y="453" text-anchor="start"><tspan x="88" dy="0">midhhealth/reliability-</tspan><tspan x="88" dy="16">operations/observability-</tspan><tspan x="88" dy="16">sre-platform</tspan></text><rect class="card" x="340" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="369" cy="414" r="17"/><text class="badgeText" x="369" y="419" text-anchor="middle">2</text><text class="cardTitle" x="398" y="415" text-anchor="start"><tspan x="398" dy="0">SLI, rule and</tspan><tspan x="398" dy="17">ownership</tspan></text><text class="body" x="358" y="453" text-anchor="start"><tspan x="358" dy="0">UC-RSO-009 • UC-RSO-010 •</tspan><tspan x="358" dy="16">UC-GOV-001 • UC-CICD-015</tspan></text><rect class="accentCard" x="610" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="639" cy="414" r="17"/><text class="badgeText" x="639" y="419" text-anchor="middle">3</text><text class="cardTitle" x="668" y="415" text-anchor="start"><tspan x="668" dy="0">Collect, correlate</tspan><tspan x="668" dy="17">and evaluate</tspan></text><text class="body" x="628" y="453" text-anchor="start"><tspan x="628" dy="0">Noisy metrics, high-</tspan><tspan x="628" dy="16">cardinality labels,</tspan><tspan x="628" dy="16">verbose logs and…</tspan></text><rect class="accentCard" x="880" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="909" cy="414" r="17"/><text class="badgeText" x="909" y="419" text-anchor="middle">4</text><text class="cardTitle" x="938" y="415" text-anchor="start"><tspan x="938" dy="0">Existing telemetry</tspan><tspan x="938" dy="17">services</tspan></text><text class="body" x="898" y="453" text-anchor="start"><tspan x="898" dy="0">SRE, service owner,</tspan><tspan x="898" dy="16">platform engineer,</tspan><tspan x="898" dy="16">incident responder, and…</tspan></text><rect class="card" x="1150" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="1179" cy="414" r="17"/><text class="badgeText" x="1179" y="419" text-anchor="middle">5</text><text class="cardTitle" x="1208" y="415" text-anchor="start"><tspan x="1208" dy="0">Dashboard / alert</tspan><tspan x="1208" dy="17">consumers</tspan></text><text class="body" x="1168" y="453" text-anchor="start"><tspan x="1168" dy="0">existing Prometheus,</tspan><tspan x="1168" dy="16">Alertmanager, Grafana,</tspan><tspan x="1168" dy="16">Loki, Tempo…</tspan></text><rect class="goodCard" x="1420" y="385" width="230" height="145" rx="14"/><circle class="badge" cx="1449" cy="414" r="17"/><text class="badgeText" x="1449" y="419" text-anchor="middle">6</text><text class="cardTitle" x="1478" y="415" text-anchor="start"><tspan x="1478" dy="0">Incident-ready</tspan><tspan x="1478" dy="17">evidence</tspan></text><text class="body" x="1438" y="453" text-anchor="start"><tspan x="1438" dy="0">The first delivery slice</tspan><tspan x="1438" dy="16">proves Noisy metrics,</tspan><tspan x="1438" dy="16">high-cardinality labels…</tspan></text><path class="arrow" d="M300 457 L340 457"/><rect class="label" x="299" y="426" width="52" height="20" rx="5"/><text class="edgeText" x="305" y="440">commit</text><path class="arrow" d="M570 457 L610 457"/><rect class="label" x="569" y="426" width="60" height="20" rx="5"/><text class="edgeText" x="575" y="440">contract</text><path class="arrow" d="M840 457 L880 457"/><rect class="label" x="839" y="426" width="60" height="20" rx="5"/><text class="edgeText" x="845" y="440">approved</text><path class="arrow" d="M1110 457 L1150 457"/><rect class="label" x="1109" y="426" width="54" height="20" rx="5"/><text class="edgeText" x="1115" y="440">execute</text><path class="arrow" d="M1380 457 L1420 457"/><rect class="label" x="1379" y="426" width="52" height="20" rx="5"/><text class="edgeText" x="1385" y="440">prove</text><polygon class="decision" points="995,580 1070,645 995,710 920,645"/><text class="cardTitle" x="995" y="637" text-anchor="middle">PROMOTE?</text><text class="small" x="995" y="658" text-anchor="middle">evidence says yes / no</text><path class="thinArrow" d="M1535 530 C1535 645 1070 645 1070 645"/><rect class="label" x="1374" y="614" width="60" height="20" rx="5"/><text class="edgeText" x="1380" y="628">evidence</text>
<rect class="warnCard" x="120" y="610" width="310" height="155" rx="14"/><text class="cardTitle" x="138" y="640" text-anchor="start"><tspan x="138" dy="0">If the line stops</tspan></text><text class="body" x="138" y="678" text-anchor="start"><tspan x="138" dy="0">No quiet bypass. Preserve the</tspan><tspan x="138" dy="16">reason, keep tune or revert rule,</tspan><tspan x="138" dy="16">and return the decision to…</tspan></text><path class="feedback" d="M920 645 C760 645 600 688 430 688"/><rect class="label" x="729" y="656" width="52" height="20" rx="5"/><text class="edgeText" x="735" y="670">block</text>
<rect class="card" x="500" y="610" width="340" height="155" rx="14"/><text class="cardTitle" x="518" y="640" text-anchor="start"><tspan x="518" dy="0">Assurance that can veto the</tspan><tspan x="518" dy="17">release</tspan></text><text class="body" x="518" y="678" text-anchor="start"><tspan x="518" dy="0">sensitive fields or credentials</tspan><tspan x="518" dy="16">leaking into telemetry and diagnostic</tspan><tspan x="518" dy="16">artifacts</tspan></text><path class="thinArrow" d="M840 687 C875 687 890 665 920 655"/><rect class="label" x="836" y="654" width="120" height="20" rx="5"/><text class="edgeText" x="842" y="668">security / quality</text>
<rect class="goodCard" x="1120" y="610" width="520" height="155" rx="14"/><text class="cardTitle" x="1138" y="640" text-anchor="start"><tspan x="1138" dy="0">What a reviewer should be able to say</tspan></text><text class="body" x="1138" y="678" text-anchor="start"><tspan x="1138" dy="0">I can trace Telemetry Cost Optimization from source</tspan><tspan x="1138" dy="16">revision to target, see why it passed, and understand how</tspan><tspan x="1138" dy="16">to recover</tspan></text>
<path class="lane" d="M70 825 H1640"/><text class="note" x="70" y="858">“Green” means the intended outcome was observed—not merely that a job finished.</text><text class="body" x="70" y="892" text-anchor="start"><tspan x="70" dy="0">Telemetry Cost Optimization turns Noisy metrics, high-cardinality labels, verbose logs and retention costs are controlled into an owned operational signal</tspan><tspan x="70" dy="17">rather than an unreviewed dashboard or alert</tspan></text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new monitoring VM, telemetry backend, paging product, or unapproved data source</tspan></text></svg>