</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0891b2"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-NET-021 — MetalLB Address Management</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Controlled service address pools</tspan></text>
<rect class="accentPanel" x="45" y="155" width="1710" height="105" rx="15"/><text class="section" x="70" y="190">Follow the service path, not the tool list</text><text class="body" x="70" y="217" text-anchor="start"><tspan x="70" dy="0">MetalLB Address Management protects service connectivity while delivering Controlled service address pools across inventoried network paths</tspan></text>
<text class="section" x="65" y="310">Requested conversation</text><text class="sectionSub" x="65" y="332">The architecture proves both the path that should work and the path that must not.</text>
<rect class="zone" x="55" y="365" width="340" height="420" rx="26"/><text class="section" x="80" y="402">Source trust zone</text><rect class="card" x="85" y="445" width="280" height="140" rx="14"/><text class="cardTitle" x="103" y="475" text-anchor="start"><tspan x="103" dy="0">Service path request</tspan></text><text class="body" x="103" y="513" text-anchor="start"><tspan x="103" dy="0">Merge request, protected</tspan><tspan x="103" dy="16">scheduled evaluation, approved</tspan><tspan x="103" dy="16">operator request, source/data…</tspan></text><rect class="card" x="85" y="620" width="280" height="125" rx="14"/><text class="cardTitle" x="103" y="650" text-anchor="start"><tspan x="103" dy="0">Source identity</tspan></text><text class="body" x="103" y="688" text-anchor="start"><tspan x="103" dy="0">network engineer, service</tspan><tspan x="103" dy="16">owner, security reviewer, SRE,</tspan><tspan x="103" dy="16">and change approver</tspan></text>
<rect class="panel" x="455" y="365" width="350" height="420" rx="26"/><text class="section" x="480" y="402">Intent and policy</text><rect class="accentCard" x="485" y="445" width="290" height="140" rx="14"/><text class="cardTitle" x="503" y="475" text-anchor="start"><tspan x="503" dy="0">Endpoint, address and</tspan><tspan x="503" dy="17">policy</tspan></text><text class="body" x="503" y="513" text-anchor="start"><tspan x="503" dy="0">UC-INFRA-007 • UC-LNX-011 • UC-</tspan><tspan x="503" dy="16">GOV-007 • UC-OBS-012</tspan></text><rect class="card" x="485" y="620" width="290" height="125" rx="14"/><text class="cardTitle" x="503" y="650" text-anchor="start"><tspan x="503" dy="0">Reviewed source</tspan></text><text class="body" x="503" y="688" text-anchor="start"><tspan x="503" dy="0">midhhealth/platform-</tspan><tspan x="503" dy="16">engineering/network-engineering-</tspan><tspan x="503" dy="16">platform</tspan></text>
<rect class="accentPanel" x="865" y="365" width="350" height="420" rx="26"/><text class="section" x="890" y="402">Path control</text><rect class="accentCard" x="895" y="445" width="290" height="140" rx="14"/><text class="cardTitle" x="913" y="475" text-anchor="start"><tspan x="913" dy="0">Resolve, evaluate and</tspan><tspan x="913" dy="17">test</tspan></text><text class="body" x="913" y="513" text-anchor="start"><tspan x="913" dy="0">Controlled service address pools</tspan></text><rect class="card" x="895" y="620" width="290" height="125" rx="14"/><text class="cardTitle" x="913" y="650" text-anchor="start"><tspan x="913" dy="0">Approved Jenkins / AWX</tspan><tspan x="913" dy="17">path</tspan></text><text class="body" x="913" y="688" text-anchor="start"><tspan x="913" dy="0">Required before any mutating or</tspan><tspan x="913" dy="16">runtime action; not required for</tspan><tspan x="913" dy="16">fixture-only CI</tspan></text>
<rect class="zone" x="1275" y="365" width="480" height="420" rx="26"/><text class="section" x="1300" y="402">Destination and proof</text><rect class="goodCard" x="1305" y="445" width="420" height="140" rx="14"/><text class="cardTitle" x="1323" y="475" text-anchor="start"><tspan x="1323" dy="0">Existing network path</tspan></text><text class="body" x="1323" y="513" text-anchor="start"><tspan x="1323" dy="0">existing DNS, NGINX, KVM bridges, Kubernetes</tspan><tspan x="1323" dy="16">networking, GitLab, Jenkins, AWX, and blackbox</tspan><tspan x="1323" dy="16">checks</tspan></text><rect class="goodCard" x="1305" y="620" width="420" height="125" rx="14"/><text class="cardTitle" x="1323" y="650" text-anchor="start"><tspan x="1323" dy="0">Reachability and config evidence</tspan></text><text class="body" x="1323" y="688" text-anchor="start"><tspan x="1323" dy="0">The first delivery slice proves Controlled</tspan><tspan x="1323" dy="16">service address pools on the documented</tspan><tspan x="1323" dy="16">existing target boundary. It uses a versioned…</tspan></text>
<path class="arrow" d="M395 515 L455 515"/><rect class="label" x="394" y="484" width="78" height="20" rx="5"/><text class="edgeText" x="400" y="498">who / where</text><path class="arrow" d="M805 515 L865 515"/><rect class="label" x="804" y="484" width="84" height="20" rx="5"/><text class="edgeText" x="810" y="498">allow / deny</text><path class="arrow" d="M1215 515 L1275 515"/><rect class="label" x="1211" y="484" width="108" height="20" rx="5"/><text class="edgeText" x="1217" y="498">packet / request</text>
<path class="thinArrow" d="M1480 785 C1480 875 1050 900 1050 745"/><text class="edgeText" x="1230" y="858">independent reachability and configuration check</text>
<rect class="warnCard" x="70" y="835" width="430" height="120" rx="14"/><text class="cardTitle" x="88" y="865" text-anchor="start"><tspan x="88" dy="0">Failure should be boring</tspan></text><text class="body" x="88" y="903" text-anchor="start"><tspan x="88" dy="0">Stop at the first broken layer, preserve</tspan><tspan x="88" dy="16">evidence, and use restore prior</tspan><tspan x="88" dy="16">configuration—never improvise across zones</tspan></text><rect class="card" x="550" y="835" width="480" height="120" rx="14"/><text class="cardTitle" x="568" y="865" text-anchor="start"><tspan x="568" dy="0">Security question</tspan></text><text class="body" x="568" y="903" text-anchor="start"><tspan x="568" dy="0">a network test or change crossing its approved</tspan><tspan x="568" dy="16">source, destination, protocol, or capture boundary</tspan></text><rect class="card" x="1080" y="835" width="620" height="120" rx="14"/><text class="cardTitle" x="1098" y="865" text-anchor="start"><tspan x="1098" dy="0">Who decides the path is acceptable</tspan></text><text class="body" x="1098" y="903" text-anchor="start"><tspan x="1098" dy="0">Enterprise Network Engineering and Automation Platform team</tspan></text>
<path class="feedback" d="M1275 705 C1180 705 1140 745 1125 835"/><rect class="label" x="1139" y="756" width="120" height="20" rx="5"/><text class="edgeText" x="1145" y="770">blocked / recovery</text><text class="note" x="70" y="990">A diagrammed arrow is not permission. The endpoint, protocol, identity and approval must all agree.</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new router, switch, firewall appliance, VM, IP, VLAN, CNI, load balancer, VPN, or cloud network</tspan></text></svg>