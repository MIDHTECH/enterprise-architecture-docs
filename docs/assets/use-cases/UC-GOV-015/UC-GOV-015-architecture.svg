<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-GOV-015" data-archetype="decision-map">
<title id="title">UC-GOV-015 Self-Healing Infrastructure architecture</title><desc id="desc">UC-GOV-015 Self-Healing Infrastructure shown as a decision-map with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accentPanel{fill:#f8fafc;stroke:#475569;stroke-width:2.3}.card{fill:#fff;stroke:#64748b;stroke-width:1.8}.accentCard{fill:#fff;stroke:#475569;stroke-width:2.4}.goodCard{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warnCard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.darkCard{fill:#0f172a;stroke:#0f172a;stroke-width:2}.mainTitle{font:700 30px Arial,sans-serif;fill:#0f172a}.kicker{font:700 12px Arial,sans-serif;fill:#475569;letter-spacing:1.2px}.quote{font:20px Arial,sans-serif;fill:#334155}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.sectionSub{font:12px Arial,sans-serif;fill:#64748b}.cardTitle{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.inverseTitle{font:700 15px Arial,sans-serif;fill:#fff}.inverseBody{font:12px Arial,sans-serif;fill:#e2e8f0}.badge{fill:#475569}.badgeText{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.thinArrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.feedback{stroke:#ea580c;stroke-width:2.7;stroke-dasharray:8 6;fill:none;marker-end:url(#orangeArrow)}.label{fill:#fff;opacity:.94}.edgeText{font:10.5px Arial,sans-serif;fill:#334155}.lane{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.decision{fill:#fff;stroke:#475569;stroke-width:2.5}.small{font:11px Arial,sans-serif;fill:#64748b}.note{font:italic 14px Georgia,serif;fill:#475569}.hub{fill:#475569;stroke:#475569;stroke-width:2}.hubTitle{font:700 18px Arial,sans-serif;fill:#fff}.hubBody{font:12px Arial,sans-serif;fill:#fff}.zone{fill:#f8fafc;stroke:#475569;stroke-width:2}.nodeCircle{fill:#fff;stroke:#475569;stroke-width:2.3}.nodeTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.nodeBody{font:11px Arial,sans-serif;fill:#475569}
</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#475569"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-GOV-015 — Self-Healing Infrastructure</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Known safe failures are repaired and verified automatically</tspan></text>
<rect class="accentPanel" x="45" y="155" width="1710" height="105" rx="15"/><text class="section" x="70" y="190">A decision map, because governance is a conversation with evidence</text><text class="body" x="70" y="217" text-anchor="start"><tspan x="70" dy="0">Self-Healing Infrastructure makes Known safe failures are repaired and verified automatically enforceable and reviewable without turning policy evaluation into</tspan><tspan x="70" dy="16">unrestricted remediation</tspan></text>
<circle class="hub" cx="900" cy="585" r="155"/><text class="hubTitle" x="900" y="540" text-anchor="middle"><tspan x="900" dy="0">Self-Healing Infrastructure</tspan></text><text class="hubBody" x="900" y="625" text-anchor="middle"><tspan x="900" dy="0">Known safe failures are repaired and</tspan><tspan x="900" dy="17">verified automatically</tspan></text><circle class="nodeCircle" cx="320" cy="330" r="125"/><circle class="badge" cx="320" cy="252" r="18"/><text class="badgeText" x="320" y="257" text-anchor="middle">1</text><text class="nodeTitle" x="320" y="306" text-anchor="middle"><tspan x="320" dy="0">Who is asking?</tspan></text><text class="nodeBody" x="320" y="354" text-anchor="middle"><tspan x="320" dy="0">platform owner, control owner,</tspan><tspan x="320" dy="15">operations engineer, security</tspan><tspan x="320" dy="15">reviewer, and change approver</tspan></text><path class="thinArrow" d="M320 330 L900 585"/><circle class="nodeCircle" cx="850" cy="285" r="125"/><circle class="badge" cx="850" cy="207" r="18"/><text class="badgeText" x="850" y="212" text-anchor="middle">2</text><text class="nodeTitle" x="850" y="261" text-anchor="middle"><tspan x="850" dy="0">What is governed?</tspan></text><text class="nodeBody" x="850" y="309" text-anchor="middle"><tspan x="850" dy="0">existing GitLab runners, AWX</tspan><tspan x="850" dy="15">inventories, Vault boundary,</tspan><tspan x="850" dy="15">repository scanners, and</tspan><tspan x="850" dy="15">evidence artifacts</tspan></text><path class="thinArrow" d="M850 285 L900 585"/><circle class="nodeCircle" cx="1380" cy="330" r="125"/><circle class="badge" cx="1380" cy="252" r="18"/><text class="badgeText" x="1380" y="257" text-anchor="middle">3</text><text class="nodeTitle" x="1380" y="306" text-anchor="middle"><tspan x="1380" dy="0">Which rule applies?</tspan></text><text class="nodeBody" x="1380" y="354" text-anchor="middle"><tspan x="1380" dy="0">UC-CICD-010 • UC-RSO-009 • UC-</tspan><tspan x="1380" dy="15">OBS-004 • UC-INFRA-007</tspan></text><path class="thinArrow" d="M1380 330 L900 585"/><circle class="nodeCircle" cx="1380" cy="750" r="125"/><circle class="badge" cx="1380" cy="672" r="18"/><text class="badgeText" x="1380" y="677" text-anchor="middle">4</text><text class="nodeTitle" x="1380" y="726" text-anchor="middle"><tspan x="1380" dy="0">What did we observe?</tspan></text><text class="nodeBody" x="1380" y="774" text-anchor="middle"><tspan x="1380" dy="0">The first delivery slice proves</tspan><tspan x="1380" dy="15">Known safe failures are repaired</tspan><tspan x="1380" dy="15">and verified automatically on</tspan><tspan x="1380" dy="15">the documented existing target…</tspan></text><path class="thinArrow" d="M1380 750 L900 585"/><circle class="nodeCircle" cx="850" cy="805" r="125"/><circle class="badge" cx="850" cy="727" r="18"/><text class="badgeText" x="850" y="732" text-anchor="middle">5</text><text class="nodeTitle" x="850" y="781" text-anchor="middle"><tspan x="850" dy="0">Who accepts it?</tspan></text><text class="nodeBody" x="850" y="829" text-anchor="middle"><tspan x="850" dy="0">Enterprise Cloud Governance and</tspan><tspan x="850" dy="15">Operations Automation team</tspan></text><path class="thinArrow" d="M850 805 L900 585"/><circle class="nodeCircle" cx="320" cy="750" r="125"/><circle class="badge" cx="320" cy="672" r="18"/><text class="badgeText" x="320" y="677" text-anchor="middle">6</text><text class="nodeTitle" x="320" y="726" text-anchor="middle"><tspan x="320" dy="0">What if it is wrong?</tspan></text><text class="nodeBody" x="320" y="774" text-anchor="middle"><tspan x="320" dy="0">Exception or rollback</tspan></text><path class="thinArrow" d="M320 750 L900 585"/><rect class="panel" x="45" y="300" width="190" height="570" rx="16"/><text class="section" x="67" y="338">Inputs</text><text class="body" x="67" y="375" text-anchor="start"><tspan x="67" dy="0">midhhealth/security-</tspan><tspan x="67" dy="16">governance/cloud-</tspan><tspan x="67" dy="16">governance-ops-</tspan><tspan x="67" dy="16">automation</tspan></text><path class="lane" d="M67 465 H210"/><text class="body" x="67" y="500" text-anchor="start"><tspan x="67" dy="0">Merge request,</tspan><tspan x="67" dy="16">protected scheduled</tspan><tspan x="67" dy="16">evaluation, approved</tspan><tspan x="67" dy="16">operator request,</tspan><tspan x="67" dy="16">source/data event, or…</tspan></text><path class="lane" d="M67 610 H210"/><text class="body" x="67" y="645" text-anchor="start"><tspan x="67" dy="0">Required before any</tspan><tspan x="67" dy="16">mutating or runtime</tspan><tspan x="67" dy="16">action; not required</tspan><tspan x="67" dy="16">for fixture-only CI</tspan></text>
<rect class="panel" x="1565" y="300" width="190" height="570" rx="16"/><text class="section" x="1587" y="338">Possible answers</text><text class="body" x="1587" y="385" text-anchor="start"><tspan x="1587" dy="0">Allow within the named</tspan><tspan x="1587" dy="16">scope</tspan></text><path class="lane" d="M1587 475 H1730"/><text class="body" x="1587" y="515" text-anchor="start"><tspan x="1587" dy="0">Block and explain why</tspan></text><path class="lane" d="M1587 605 H1730"/><text class="body" x="1587" y="645" text-anchor="start"><tspan x="1587" dy="0">Time-box an owned</tspan><tspan x="1587" dy="16">exception</tspan></text><path class="lane" d="M1587 750 H1730"/><text class="body" x="1587" y="785" text-anchor="start"><tspan x="1587" dy="0">Recover and review</tspan></text>
<path class="arrow" d="M1055 585 L1565 585"/><rect class="label" x="1254" y="554" width="114" height="20" rx="5"/><text class="edgeText" x="1260" y="568">decision + reason</text><path class="feedback" d="M1565 815 C1450 980 350 980 320 875"/><rect class="label" x="779" y="946" width="204" height="20" rx="5"/><text class="edgeText" x="785" y="960">feedback changes policy or scope</text>
<text class="note" x="300" y="990">Good governance makes the decision legible to the person affected by it.</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new governance VM, scanner service, cloud account, identity platform, or automatic high-risk remediation</tspan></text></svg>