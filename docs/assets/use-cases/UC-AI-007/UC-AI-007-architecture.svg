</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#db2777"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-AI-007 — AI Prompt and Response Evaluation</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">Regression, safety and quality evaluation</tspan></text>
<rect class="accentPanel" x="45" y="160" width="1710" height="100" rx="15"/><text class="section" x="70" y="195">The story in plain language</text><text class="body" x="70" y="222" text-anchor="start"><tspan x="70" dy="0">AI Prompt and Response Evaluation defines the healthcare-safe behavior needed for Regression, safety and quality evaluation before AI output can influence</tspan><tspan x="70" dy="16">an enterprise workflow</tspan></text>
<text class="section" x="65" y="310">Data moves forward; trust is earned at every boundary</text><text class="sectionSub" x="65" y="332">The useful path and the refusal/replay path are both first-class.</text>
<rect class="zone" x="55" y="360" width="300" height="480" rx="18"/><text class="section" x="80" y="397">Where it begins</text><rect class="card" x="80" y="430" width="250" height="145" rx="14"/><text class="cardTitle" x="98" y="460" text-anchor="start"><tspan x="98" dy="0">User question or</tspan><tspan x="98" dy="17">workflow</tspan></text><text class="body" x="98" y="498" text-anchor="start"><tspan x="98" dy="0">Merge request, protected</tspan><tspan x="98" dy="16">scheduled evaluation,</tspan><tspan x="98" dy="16">approved operator request…</tspan></text><rect class="card" x="80" y="610" width="250" height="150" rx="14"/><text class="cardTitle" x="98" y="640" text-anchor="start"><tspan x="98" dy="0">People accountable</tspan></text><text class="body" x="98" y="678" text-anchor="start"><tspan x="98" dy="0">clinical/product owner, AI</tspan><tspan x="98" dy="16">engineer, data steward,</tspan><tspan x="98" dy="16">security/privacy reviewer…</tspan></text>
<rect class="panel" x="405" y="360" width="310" height="480" rx="18"/><text class="section" x="430" y="397">Make it understandable</text><rect class="accentCard" x="430" y="430" width="260" height="145" rx="14"/><text class="cardTitle" x="448" y="460" text-anchor="start"><tspan x="448" dy="0">Access, prompt and</tspan><tspan x="448" dy="17">data contract</tspan></text><text class="body" x="448" y="498" text-anchor="start"><tspan x="448" dy="0">UC-DATA-015 • UC-DATA-023 •</tspan><tspan x="448" dy="16">UC-AI-011 • UC-MLOPS-004</tspan></text><rect class="card" x="430" y="610" width="260" height="150" rx="14"/><text class="cardTitle" x="448" y="640" text-anchor="start"><tspan x="448" dy="0">Repository truth</tspan></text><text class="body" x="448" y="678" text-anchor="start"><tspan x="448" dy="0">midhhealth/ai-and-ml-</tspan><tspan x="448" dy="16">platform/healthcare-ai-</tspan><tspan x="448" dy="16">platform</tspan></text>
<rect class="accentPanel" x="765" y="360" width="350" height="480" rx="18"/><text class="section" x="790" y="397">Do the work safely</text><rect class="accentCard" x="790" y="430" width="300" height="145" rx="14"/><text class="cardTitle" x="808" y="460" text-anchor="start"><tspan x="808" dy="0">Retrieve, evaluate and</tspan><tspan x="808" dy="17">guard</tspan></text><text class="body" x="808" y="498" text-anchor="start"><tspan x="808" dy="0">Regression, safety and quality</tspan><tspan x="808" dy="16">evaluation</tspan></text><rect class="card" x="790" y="610" width="300" height="150" rx="14"/><text class="cardTitle" x="808" y="640" text-anchor="start"><tspan x="808" dy="0">Offline runner / approved</tspan><tspan x="808" dy="17">runtime</tspan></text><text class="body" x="808" y="678" text-anchor="start"><tspan x="808" dy="0">Fixture proof first; runtime use</tspan><tspan x="808" dy="16">remains separately approved</tspan></text>
<rect class="panel" x="1165" y="360" width="300" height="480" rx="18"/><text class="section" x="1190" y="397">Make the result useful</text><rect class="goodCard" x="1190" y="430" width="250" height="145" rx="14"/><text class="cardTitle" x="1208" y="460" text-anchor="start"><tspan x="1208" dy="0">Human-reviewed</tspan><tspan x="1208" dy="17">output</tspan></text><text class="body" x="1208" y="498" text-anchor="start"><tspan x="1208" dy="0">existing GitLab shared</tspan><tspan x="1208" dy="16">runner, approved repository</tspan><tspan x="1208" dy="16">content, synthetic…</tspan></text><rect class="goodCard" x="1190" y="610" width="250" height="150" rx="14"/><text class="cardTitle" x="1208" y="640" text-anchor="start"><tspan x="1208" dy="0">Citations and safety</tspan><tspan x="1208" dy="17">evidence</tspan></text><text class="body" x="1208" y="678" text-anchor="start"><tspan x="1208" dy="0">The first delivery slice</tspan><tspan x="1208" dy="16">proves Regression, safety</tspan><tspan x="1208" dy="16">and quality evaluation on…</tspan></text>
<rect class="panel" x="1515" y="360" width="240" height="480" rx="18"/><text class="section" x="1540" y="397">When trust breaks</text><rect class="warnCard" x="1540" y="430" width="190" height="175" rx="14"/><text class="cardTitle" x="1558" y="460" text-anchor="start"><tspan x="1558" dy="0">Refuse, stop or</tspan><tspan x="1558" dy="17">rollback</tspan></text><text class="body" x="1558" y="498" text-anchor="start"><tspan x="1558" dy="0">Quarantine or refuse</tspan><tspan x="1558" dy="16">the bounded item;</tspan><tspan x="1558" dy="16">never widen scope to…</tspan></text><rect class="card" x="1540" y="640" width="190" height="120" rx="14"/><text class="cardTitle" x="1558" y="670" text-anchor="start"><tspan x="1558" dy="0">Owner decision</tspan></text><text class="body" x="1558" y="708" text-anchor="start"><tspan x="1558" dy="0">Enterprise Healthcare</tspan><tspan x="1558" dy="16">AI Platform team</tspan></text>
<path class="arrow" d="M355 525 L405 525"/><rect class="label" x="354" y="494" width="52" height="20" rx="5"/><text class="edgeText" x="360" y="508">input</text><path class="arrow" d="M715 525 L765 525"/><rect class="label" x="709" y="494" width="60" height="20" rx="5"/><text class="edgeText" x="715" y="508">contract</text><path class="arrow" d="M1115 525 L1165 525"/><rect class="label" x="1109" y="494" width="66" height="20" rx="5"/><text class="edgeText" x="1115" y="508">validated</text><path class="feedback" d="M1465 525 L1515 525"/><rect class="label" x="1459" y="494" width="52" height="20" rx="5"/><text class="edgeText" x="1465" y="508">reject</text><path class="thinArrow" d="M1440 685 C1490 685 1500 700 1540 700"/><rect class="label" x="1459" y="656" width="52" height="20" rx="5"/><text class="edgeText" x="1465" y="670">review</text>
<path class="feedback" d="M1635 605 C1635 910 920 940 920 760"/><rect class="label" x="1104" y="903" width="228" height="20" rx="5"/><text class="edgeText" x="1110" y="917">replay / reconcile only after review</text>
<text class="cardTitle" x="70" y="895">Guardrail</text><text class="body" x="70" y="920" text-anchor="start"><tspan x="70" dy="0">prompt, retrieved content, model output, or tool request crossing a data or authorization boundary</tspan></text><text class="note" x="70" y="970">The diagram follows the data, but ownership never disappears into the pipeline.</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new model server, vector database, VM, GPU host, cluster workload, cloud API, live clinical integration, or protected data</tspan></text></svg>