<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-AI-007" data-archetype="data-flow">
<title id="title">UC-AI-007 AI Prompt and Response Evaluation architecture</title><desc id="desc">UC-AI-007 AI Prompt and Response Evaluation shown as a data-flow with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
