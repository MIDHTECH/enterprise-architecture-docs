<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">010 Filesystem, LVM and Storage Management architecture</title>
<desc id="desc">Change storage only after stable device identity, data protection and recovery are clear. The flow moves from reviewed source and approval through IaC execution to runtime validation, convergence and recovery evidence.</desc>
<defs>
<style>
.bg{fill:#ffffff}.frame{fill:#f8fafc;stroke:#2563eb;stroke-width:3}.zone{fill:#ffffff;stroke:#60a5fa;stroke-width:2.5;stroke-dasharray:9 7}.title{font:700 32px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.zoneTitle{font:700 22px Arial,sans-serif;fill:#0f172a}.boxTitle{font:700 18px Arial,sans-serif;fill:#111827}.boxSub{font:14px Arial,sans-serif;fill:#475569}.amber{fill:#fffbeb;stroke:#b45309;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.purple{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.red{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.green{fill:#ecfdf5;stroke:#15803d;stroke-width:2}.flow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.feedback{stroke:#15803d;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#greenArrow)}.controlTitle{font:700 18px Arial,sans-serif;fill:#0f172a}.control{font:700 15px Arial,sans-serif;fill:#1e3a8a}
