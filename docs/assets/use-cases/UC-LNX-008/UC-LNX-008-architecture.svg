<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">008 SELinux and Firewall Management architecture</title>
<desc id="desc">Express service access as minimal policy, then prove both allowed and denied traffic. The flow moves from reviewed source and approval through IaC execution to runtime validation, convergence and recovery evidence.</desc>
