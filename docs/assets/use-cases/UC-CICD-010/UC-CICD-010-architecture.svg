<text class="subtitle" x="42" y="83" text-anchor="start"><tspan x="42" dy="0">Security checks are embedded into delivery workflow</tspan></text>
<rect class="context" x="35" y="120" width="1730" height="92" rx="14"/>
<text class="contextTitle" x="60" y="150">Enterprise outcome</text><text class="contextText" x="60" y="174" text-anchor="start"><tspan x="60" dy="0">Shared digital platform, risk and compliance, operational</tspan><tspan x="60" dy="15">resilience</tspan></text>
<text class="contextTitle" x="655" y="150">Owning platform</text><text class="contextText" x="655" y="174" text-anchor="start"><tspan x="655" dy="0">Enterprise DevSecOps Delivery Platform</tspan></text>
<text class="contextTitle" x="1215" y="150">Current state</text><text class="contextText" x="1215" y="174" text-anchor="start"><tspan x="1215" dy="0">Planned — detailed design only; implementation and runtime</tspan><tspan x="1215" dy="15">evidence are not claimed</tspan></text>

