<rect class="node" x="55" y="618" width="210" height="125" rx="12"/><circle class="iconBadge" cx="83" cy="648" r="17"/><use href="#icon-contract" x="73" y="638" width="20" height="20"/><text class="nodeTitle" x="113" y="645"><tspan x="113" dy="0">Trigger</tspan></text><text class="nodeSub" x="73" y="676" text-anchor="start"><tspan x="73" dy="0">Merge request,</tspan><tspan x="73" dy="14">protected scheduled</tspan><tspan x="73" dy="14">evaluation, approved…</tspan></text>
