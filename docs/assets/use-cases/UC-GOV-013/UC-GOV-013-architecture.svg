<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc" data-use-case="UC-GOV-013" data-archetype="lifecycle">
<title id="title">UC-GOV-013 Human-in-the-Loop Remediation architecture</title><desc id="desc">UC-GOV-013 Human-in-the-Loop Remediation shown as a lifecycle with human actors, real handoffs, existing targets, evidence, and recovery.</desc>
<defs><style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accentPanel{fill:#f8fafc;stroke:#475569;stroke-width:2.3}.card{fill:#fff;stroke:#64748b;stroke-width:1.8}.accentCard{fill:#fff;stroke:#475569;stroke-width:2.4}.goodCard{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warnCard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.darkCard{fill:#0f172a;stroke:#0f172a;stroke-width:2}.mainTitle{font:700 30px Arial,sans-serif;fill:#0f172a}.kicker{font:700 12px Arial,sans-serif;fill:#475569;letter-spacing:1.2px}.quote{font:20px Arial,sans-serif;fill:#334155}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.sectionSub{font:12px Arial,sans-serif;fill:#64748b}.cardTitle{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.inverseTitle{font:700 15px Arial,sans-serif;fill:#fff}.inverseBody{font:12px Arial,sans-serif;fill:#e2e8f0}.badge{fill:#475569}.badgeText{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.thinArrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.feedback{stroke:#ea580c;stroke-width:2.7;stroke-dasharray:8 6;fill:none;marker-end:url(#orangeArrow)}.label{fill:#fff;opacity:.94}.edgeText{font:10.5px Arial,sans-serif;fill:#334155}.lane{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.decision{fill:#fff;stroke:#475569;stroke-width:2.5}.small{font:11px Arial,sans-serif;fill:#64748b}.note{font:italic 14px Georgia,serif;fill:#475569}.hub{fill:#475569;stroke:#475569;stroke-width:2}.hubTitle{font:700 18px Arial,sans-serif;fill:#fff}.hubBody{font:12px Arial,sans-serif;fill:#fff}.zone{fill:#f8fafc;stroke:#475569;stroke-width:2}.nodeCircle{fill:#fff;stroke:#475569;stroke-width:2.3}.nodeTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.nodeBody{font:11px Arial,sans-serif;fill:#475569}
</style>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#475569"/></marker><marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1800" height="1120"/><text class="mainTitle" x="46" y="50"><tspan x="46" dy="0">UC-GOV-013 — Human-in-the-Loop Remediation</tspan></text><text class="kicker" x="47" y="88">WHAT WE’RE TRYING TO MAKE TRUE</text><text class="quote" x="46" y="116" text-anchor="start"><tspan x="46" dy="0">High-risk remediation pauses for approval before execution</tspan></text>
<rect class="accentPanel" x="45" y="155" width="1710" height="105" rx="15"/><text class="section" x="70" y="190">A controlled lifecycle, with the hard parts visible</text><text class="body" x="70" y="217" text-anchor="start"><tspan x="70" dy="0">Human-in-the-Loop Remediation makes High-risk remediation pauses for approval before execution enforceable and reviewable without turning policy evaluation into</tspan><tspan x="70" dy="16">unrestricted remediation</tspan></text>
<text class="section" x="70" y="315">The path through the change</text><text class="sectionSub" x="70" y="337">Preparation and recovery receive the same design attention as execution.</text><text class="kicker" x="65" y="378">PREPARE</text><rect class="card" x="65" y="395" width="235" height="180" rx="14"/><circle class="badge" cx="94" cy="424" r="17"/><text class="badgeText" x="94" y="429" text-anchor="middle">1</text><text class="cardTitle" x="123" y="425" text-anchor="start"><tspan x="123" dy="0">Control request</tspan></text><text class="body" x="83" y="463" text-anchor="start"><tspan x="83" dy="0">midhhealth/security-</tspan><tspan x="83" dy="16">governance/cloud-</tspan><tspan x="83" dy="16">governance-ops-automation</tspan></text><path class="arrow" d="M300 485 L345 485"/><rect class="label" x="297" y="453" width="52" height="20" rx="5"/><text class="edgeText" x="303" y="467">ready</text><text class="kicker" x="345" y="378">PROVE</text><rect class="card" x="345" y="395" width="235" height="180" rx="14"/><circle class="badge" cx="374" cy="424" r="17"/><text class="badgeText" x="374" y="429" text-anchor="middle">2</text><text class="cardTitle" x="403" y="425" text-anchor="start"><tspan x="403" dy="0">Identity, resource</tspan><tspan x="403" dy="17">and policy</tspan></text><text class="body" x="363" y="463" text-anchor="start"><tspan x="363" dy="0">UC-CICD-010 • UC-RSO-009 •</tspan><tspan x="363" dy="16">UC-OBS-004 • UC-INFRA-007</tspan></text><path class="arrow" d="M580 485 L625 485"/><rect class="label" x="577" y="453" width="60" height="20" rx="5"/><text class="edgeText" x="583" y="467">evidence</text><text class="kicker" x="625" y="378">AUTHORIZE</text><rect class="accentCard" x="625" y="395" width="235" height="180" rx="14"/><circle class="badge" cx="654" cy="424" r="17"/><text class="badgeText" x="654" y="429" text-anchor="middle">3</text><text class="cardTitle" x="683" y="425" text-anchor="start"><tspan x="683" dy="0">Approved</tspan><tspan x="683" dy="17">remediation path</tspan></text><text class="body" x="643" y="463" text-anchor="start"><tspan x="643" dy="0">Required before any</tspan><tspan x="643" dy="16">mutating or runtime</tspan><tspan x="643" dy="16">action; not required for…</tspan></text><path class="arrow" d="M860 485 L905 485"/><rect class="label" x="857" y="453" width="60" height="20" rx="5"/><text class="edgeText" x="863" y="467">approved</text><text class="kicker" x="905" y="378">ACT</text><rect class="accentCard" x="905" y="395" width="235" height="180" rx="14"/><circle class="badge" cx="934" cy="424" r="17"/><text class="badgeText" x="934" y="429" text-anchor="middle">4</text><text class="cardTitle" x="963" y="425" text-anchor="start"><tspan x="963" dy="0">Human-in-the-Loop</tspan><tspan x="963" dy="17">Remediation</tspan></text><text class="body" x="923" y="463" text-anchor="start"><tspan x="923" dy="0">existing GitLab runners,</tspan><tspan x="923" dy="16">AWX inventories, Vault</tspan><tspan x="923" dy="16">boundary, repository…</tspan></text><path class="arrow" d="M1140 485 L1185 485"/><rect class="label" x="1137" y="453" width="60" height="20" rx="5"/><text class="edgeText" x="1143" y="467">observed</text><text class="kicker" x="1185" y="378">VERIFY</text><rect class="goodCard" x="1185" y="395" width="235" height="180" rx="14"/><circle class="badge" cx="1214" cy="424" r="17"/><text class="badgeText" x="1214" y="429" text-anchor="middle">5</text><text class="cardTitle" x="1243" y="425" text-anchor="start"><tspan x="1243" dy="0">Audit evidence</tspan></text><text class="body" x="1203" y="463" text-anchor="start"><tspan x="1203" dy="0">The first delivery slice</tspan><tspan x="1203" dy="16">proves High-risk</tspan><tspan x="1203" dy="16">remediation pauses for…</tspan></text><path class="arrow" d="M1420 485 L1465 485"/><rect class="label" x="1417" y="453" width="54" height="20" rx="5"/><text class="edgeText" x="1423" y="467">recover</text><text class="kicker" x="1465" y="378">RECOVER</text><rect class="warnCard" x="1465" y="395" width="235" height="180" rx="14"/><circle class="badge" cx="1494" cy="424" r="17"/><text class="badgeText" x="1494" y="429" text-anchor="middle">6</text><text class="cardTitle" x="1523" y="425" text-anchor="start"><tspan x="1523" dy="0">Exception or</tspan><tspan x="1523" dy="17">rollback</tspan></text><text class="body" x="1483" y="463" text-anchor="start"><tspan x="1483" dy="0">Enterprise Cloud</tspan><tspan x="1483" dy="16">Governance and Operations</tspan><tspan x="1483" dy="16">Automation team</tspan></text><rect class="panel" x="65" y="640" width="1080" height="285" rx="18"/><text class="section" x="90" y="678">What changes hands at each stage</text><rect class="card" x="90" y="710" width="300" height="165" rx="14"/><text class="cardTitle" x="108" y="740" text-anchor="start"><tspan x="108" dy="0">People</tspan></text><text class="body" x="108" y="778" text-anchor="start"><tspan x="108" dy="0">platform owner, control owner,</tspan><tspan x="108" dy="16">operations engineer, security</tspan><tspan x="108" dy="16">reviewer, and change approver</tspan></text><rect class="warnCard" x="420" y="710" width="330" height="165" rx="14"/><text class="cardTitle" x="438" y="740" text-anchor="start"><tspan x="438" dy="0">Safety question</tspan></text><text class="body" x="438" y="778" text-anchor="start"><tspan x="438" dy="0">Could a governance workflow</tspan><tspan x="438" dy="16">receiving broader privileges than</tspan><tspan x="438" dy="16">the control scope requires? If yes…</tspan></text><rect class="goodCard" x="780" y="710" width="340" height="165" rx="14"/><text class="cardTitle" x="798" y="740" text-anchor="start"><tspan x="798" dy="0">Evidence</tspan></text><text class="body" x="798" y="778" text-anchor="start"><tspan x="798" dy="0">A reviewer can connect the source,</tspan><tspan x="798" dy="16">target, timing, outcome and recovery</tspan><tspan x="798" dy="16">for Human-in-the-Loop Remediation</tspan></text>
<rect class="panel" x="1190" y="640" width="510" height="285" rx="18"/><text class="section" x="1215" y="678">The return path is deliberate</text><text class="body" x="1215" y="715" text-anchor="start"><tspan x="1215" dy="0">A failed check goes to recovery, not around the gate. After</tspan><tspan x="1215" dy="18">recovery, the owner decides whether to retry, redesign, or stop</tspan></text><path class="feedback" d="M1580 825 C1580 960 205 960 205 575"/><rect class="label" x="754" y="934" width="180" height="20" rx="5"/><text class="edgeText" x="760" y="948">return to a known-good point</text>
<text class="note" x="70" y="985">No stage earns trust from its position in the sequence; each earns it from evidence.</text><rect class="warnCard" x="45" y="1012" width="1710" height="70" rx="14"/><text class="cardTitle" x="67" y="1040">The line we do not cross in this design</text><text class="body" x="67" y="1062" text-anchor="start"><tspan x="67" dy="0">Reuse the existing lab; do not create a new governance VM, scanner service, cloud account, identity platform, or automatic high-risk remediation</tspan></text></svg>