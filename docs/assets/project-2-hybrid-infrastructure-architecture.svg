<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">MidhHealth hybrid cloud network architecture</title>
  <desc id="desc">Detailed hybrid cloud network architecture showing MidhHealth on-premises datacenters, Azure ExpressRoute, Microsoft edge, transit VNet, hub VNet, spoke VNet, route servers, NVAs, BGP routing, and infrastructure automation controls.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .cloud { fill: #f8fbff; stroke: #2563eb; stroke-width: 3; }
      .onprem { fill: #fffdf7; stroke: #111827; stroke-width: 3; }
      .zone { fill: #ffffff; stroke: #2563eb; stroke-width: 2.4; stroke-dasharray: 8 6; rx: 10; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2.2; rx: 8; }
      .svc { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .net { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 8; }
      .sec { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .ops { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; rx: 8; }
      .auto { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 8; }
      .warn { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .h1 { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 700 15px Arial, sans-serif; fill: #111827; }
      .txt { font: 13px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .route { font: 700 15px Arial, sans-serif; fill: #0284c7; }
      .bgp { font: 700 16px Arial, sans-serif; fill: #16a34a; }
      .purple { font: 700 15px Arial, sans-serif; fill: #6d28d9; }
      .icon { font: 700 25px Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .blueLine { stroke: #0284c7; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .purpleLine { stroke: #6d28d9; stroke-width: 4; fill: none; marker-end: url(#arrowPurple); }
      .greenLine { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .dashLine { stroke: #334155; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect class="bg" width="1700" height="980"/>
  <text class="title" x="32" y="48">MidhHealth Hybrid Cloud Infrastructure Architecture</text>
  <text class="txt" x="34" y="76">Azure ExpressRoute hub-and-spoke shown in detail; AWS and GCP follow the same governed landing-zone, private-connectivity, policy, and evidence model.</text>

  <rect class="cloud" x="20" y="105" width="1660" height="575"/>
  <text class="h1" x="52" y="142">Microsoft Azure Landing Zone</text>
  <text class="small" x="52" y="164">Private connectivity, transit routing, firewall inspection, workload spokes, and platform evidence</text>

  <rect class="box" x="50" y="210" width="310" height="98"/>
  <text class="h2" x="84" y="244">Azure VMware Solution</text>
  <text class="txt" x="84" y="267">Private cloud for migration waves</text>
  <text class="small" x="84" y="288">AVS management and workload prefixes</text>
  <text class="icon" x="62" y="266">A</text>

  <circle cx="445" cy="260" r="23" fill="#111827"/>
  <text x="445" y="268" text-anchor="middle" font-family="Arial" font-size="24" fill="#ffffff">X</text>
  <text class="h2" x="398" y="205">Dedicated Microsoft</text>
  <text class="h2" x="415" y="226">Enterprise Edge</text>
  <text class="small" x="398" y="302">D-MSEE / MSEE</text>

