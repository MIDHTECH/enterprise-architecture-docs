<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">MidhHealth hybrid infrastructure architecture</title>
  <desc id="desc">Architecture diagram showing healthcare users, delivery control plane, on-premises datacenters, cloud landing zones, observability, governance, Terraform, Ansible, and drift remediation flows.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .cap { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .blue { fill: #dbeafe; stroke: #1d4ed8; }
      .green { fill: #dcfce7; stroke: #15803d; }
      .amber { fill: #fef3c7; stroke: #b45309; }
      .red { fill: #fee2e2; stroke: #b91c1c; }
      .purple { fill: #ede9fe; stroke: #6d28d9; }
      .slate { fill: #e2e8f0; stroke: #334155; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .h1 { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .txt { font: 13px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .tiny { font: 11px Arial, sans-serif; fill: #475569; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .flow2 { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrowBlue); }
      .flow3 { stroke: #b45309; stroke-width: 2.2; fill: none; marker-end: url(#arrowAmber); stroke-dasharray: 8 5; }
      .icon { font: 700 25px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="40" y="52">Project 2: Enterprise Multi-Cloud Infrastructure Platform</text>
  <text class="txt" x="42" y="82">Hybrid infrastructure architecture for MidhHealth: on-premises services, cloud landing zones, governance controls, and automation feedback loops.</text>

  <rect class="zone" x="40" y="125" width="250" height="655"/>
  <text class="h1" x="62" y="160">Healthcare Channels</text>
  <rect class="cap blue" x="65" y="195" width="200" height="76"/>
  <text class="icon" x="88" y="237">H</text>
  <text class="h2" x="128" y="225">Hospitals</text>
  <text class="small" x="128" y="247">Care delivery systems</text>
  <rect class="cap blue" x="65" y="300" width="200" height="76"/>
  <text class="icon" x="88" y="342">M</text>
  <text class="h2" x="128" y="330">Medical Offices</text>
  <text class="small" x="128" y="352">Clinics and providers</text>
  <rect class="cap green" x="65" y="405" width="200" height="76"/>
  <text class="icon" x="88" y="447">P</text>
  <text class="h2" x="128" y="435">Payer Operations</text>
  <text class="small" x="128" y="457">Claims and eligibility</text>
  <rect class="cap purple" x="65" y="510" width="200" height="76"/>
  <text class="icon" x="88" y="552">S</text>
  <text class="h2" x="128" y="540">SaaS Partners</text>
  <text class="small" x="128" y="562">EHR, claims, identity</text>

  <rect class="zone" x="335" y="125" width="885" height="655"/>
  <text class="h1" x="360" y="160">On-Premises Platform Facilities</text>
  <text class="small" x="360" y="182">Existing platform footprint: infra01, infra02, planned infra03, and governed VM/Kubernetes services</text>

  <rect class="panel" x="360" y="215" width="395" height="220"/>
  <text class="h1" x="382" y="248">Colocation Facility 1</text>
  <rect class="cap slate" x="385" y="275" width="150" height="58"/>
  <text class="h2" x="405" y="300">infra01 / infra02</text>
  <text class="tiny" x="405" y="318">KVM and libvirt hosts</text>
  <rect class="cap blue" x="555" y="275" width="170" height="58"/>
  <text class="h2" x="575" y="300">Rocky Linux VMs</text>
  <text class="tiny" x="575" y="318">Platform services</text>
  <rect class="cap green" x="385" y="350" width="150" height="58"/>
  <text class="h2" x="405" y="375">Kubernetes</text>
  <text class="tiny" x="405" y="393">kubeadm cluster</text>
  <rect class="cap amber" x="555" y="350" width="170" height="58"/>
  <text class="h2" x="575" y="375">Databases</text>
  <text class="tiny" x="575" y="393">PostgreSQL / service DBs</text>

  <rect class="panel" x="785" y="215" width="400" height="220"/>
  <text class="h1" x="807" y="248">Shared Services</text>
  <rect class="cap purple" x="810" y="275" width="158" height="58"/>
  <text class="h2" x="830" y="300">GitLab</text>
  <text class="tiny" x="830" y="318">Repos and review</text>
  <rect class="cap purple" x="995" y="275" width="158" height="58"/>
  <text class="h2" x="1015" y="300">Jenkins / AWX</text>
  <text class="tiny" x="1015" y="318">Pipeline and runbooks</text>
  <rect class="cap blue" x="810" y="350" width="158" height="58"/>
  <text class="h2" x="830" y="375">NGINX / DNS</text>
  <text class="tiny" x="830" y="393">Ingress and routing</text>
  <rect class="cap green" x="995" y="350" width="158" height="58"/>
  <text class="h2" x="1015" y="375">Monitoring</text>
  <text class="tiny" x="1015" y="393">Prometheus / Grafana</text>

  <rect class="panel" x="360" y="475" width="395" height="225"/>
  <text class="h1" x="382" y="508">Colocation Facility 2</text>
  <rect class="cap slate" x="385" y="535" width="150" height="58"/>
  <text class="h2" x="405" y="560">Worker Capacity</text>
  <text class="tiny" x="405" y="578">Kubernetes and apps</text>
  <rect class="cap amber" x="555" y="535" width="170" height="58"/>
  <text class="h2" x="575" y="560">Backup Storage</text>
  <text class="tiny" x="575" y="578">MinIO / restic / DB</text>
  <rect class="cap green" x="385" y="610" width="150" height="58"/>
  <text class="h2" x="405" y="635">infra03</text>
  <text class="tiny" x="405" y="653">Planned 256 GB host</text>
  <rect class="cap purple" x="555" y="610" width="170" height="58"/>
  <text class="h2" x="575" y="635">AI/ML Edge</text>
  <text class="tiny" x="575" y="653">Mac Studio dev node</text>

  <rect class="panel" x="785" y="475" width="400" height="225"/>
  <text class="h1" x="807" y="508">Evidence Layer</text>
  <rect class="cap green" x="810" y="535" width="158" height="58"/>
  <text class="h2" x="830" y="560">Metrics / Logs</text>
  <text class="tiny" x="830" y="578">Prometheus, Loki, Elastic</text>
  <rect class="cap green" x="995" y="535" width="158" height="58"/>
  <text class="h2" x="1015" y="560">Splunk / Audit</text>
  <text class="tiny" x="1015" y="578">Security evidence</text>
  <rect class="cap amber" x="810" y="610" width="158" height="58"/>
  <text class="h2" x="830" y="635">Drift Reports</text>
  <text class="tiny" x="830" y="653">Terraform and config</text>
  <rect class="cap red" x="995" y="610" width="158" height="58"/>
  <text class="h2" x="1015" y="635">Approval Gates</text>
  <text class="tiny" x="1015" y="653">High-risk remediation</text>

  <rect class="zone" x="1265" y="125" width="285" height="655"/>
  <text class="h1" x="1288" y="160">Cloud Landing Zones</text>
  <rect class="panel" x="1290" y="195" width="235" height="135"/>
  <text class="h1" x="1312" y="226">AWS</text>
  <text class="txt" x="1312" y="254">VPC, EC2, S3, RDS</text>
  <text class="txt" x="1312" y="277">IAM, EKS/ECS pattern</text>
  <rect class="panel" x="1290" y="370" width="235" height="135"/>
  <text class="h1" x="1312" y="401">Azure</text>
  <text class="txt" x="1312" y="429">VNet, VM, Blob</text>
  <text class="txt" x="1312" y="452">PostgreSQL, AKS, RBAC</text>
  <rect class="panel" x="1290" y="545" width="235" height="135"/>
  <text class="h1" x="1312" y="576">GCP</text>
  <text class="txt" x="1312" y="604">VPC, Compute, GCS</text>
  <text class="txt" x="1312" y="627">Cloud SQL, GKE, IAM</text>

  <rect class="panel" x="335" y="830" width="885" height="105"/>
  <text class="h1" x="360" y="862">Infrastructure Automation Control Loop</text>
  <rect class="cap purple" x="365" y="882" width="140" height="34"/>
  <text class="small" x="385" y="904">Terraform modules</text>
  <rect class="cap blue" x="525" y="882" width="140" height="34"/>
  <text class="small" x="550" y="904">Plan analyzer</text>
  <rect class="cap amber" x="685" y="882" width="140" height="34"/>
  <text class="small" x="712" y="904">Drift detector</text>
  <rect class="cap red" x="845" y="882" width="140" height="34"/>
  <text class="small" x="870" y="904">Policy gates</text>
  <rect class="cap green" x="1005" y="882" width="180" height="34"/>
  <text class="small" x="1028" y="904">AWX / Ansible apply</text>

  <path class="flow" d="M265 232 C310 232 315 305 360 305"/>
  <path class="flow" d="M265 442 C310 442 315 380 360 380"/>
  <path class="flow2" d="M1185 305 C1225 305 1240 260 1290 260"/>
  <path class="flow2" d="M1185 565 C1230 565 1240 440 1290 440"/>
  <path class="flow2" d="M1185 640 C1230 640 1240 615 1290 615"/>
  <path class="flow" d="M968 333 C1005 450 1120 450 1120 535"/>
  <path class="flow" d="M640 408 C640 448 640 490 640 535"/>
  <path class="flow3" d="M1095 668 C1095 745 1095 815 1095 882"/>
  <path class="flow3" d="M755 882 C755 805 800 705 890 668"/>
  <path class="flow2" d="M505 899 L525 899"/>
  <path class="flow2" d="M665 899 L685 899"/>
  <path class="flow2" d="M825 899 L845 899"/>
  <path class="flow2" d="M985 899 L1005 899"/>

  <text class="small" x="1246" y="815">Cloud resources are target zones; apply remains gated by plan, policy, owner, and environment approval.</text>
</svg>
