  <path class="line" d="M875 260 L930 260"/>
  <path class="line" d="M875 430 L930 527"/>

  <rect class="onprem" x="135" y="735" width="560" height="178"/>
  <text class="h1" x="162" y="770">MidhHealth Data Center / Co-Lo</text>
  <rect class="svc" x="165" y="800" width="132" height="70"/>
  <text class="h2" x="186" y="827">infra01</text>
