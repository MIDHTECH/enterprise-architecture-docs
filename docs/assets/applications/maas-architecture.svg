</defs>
<rect class="bg" width="1800" height="1260"/><rect class="paper" x="25" y="25" width="1750" height="1210" rx="22"/>
<text class="title" x="58" y="70">MAAS: the operational record at the center of a human placement journey</text>
<text class="sub" x="58" y="101">DOCUMENTATION VIEW — source topology and code contracts are verified; current host, release, telemetry and recovery remain unverified.</text>

<rect class="blue" x="58" y="145" width="255" height="205" rx="18"/>
<circle cx="112" cy="204" r="29" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="112" cy="193" r="8" fill="#2563eb"/><path d="M94 225Q112 206 130 225" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<text class="section" x="157" y="198">People making</text><text class="section" x="157" y="223">decisions</text>
<text class="body" x="84" y="270">Admin • Staff • Submission Team</text><text class="body" x="84" y="292">Consultant</text><text class="small" x="84" y="324">The journey—not the tool—is the unit of value.</text>

<rect class="paper" x="355" y="135" width="1388" height="465" rx="20"/>
<text class="section" x="385" y="175">MAAS application boundary described by source</text>
<rect class="blue" x="395" y="215" width="340" height="150" rx="16"/>
<text class="head" x="420" y="250">Django + Gunicorn web</text><text class="body" x="420" y="277">companies • consultants • jobs</text><text class="body" x="420" y="298">submissions • interviews • reports</text><text class="small" x="420" y="331">shallow /health • deep database/cache/media</text>
<path class="flow" d="M313 247H395"/><text class="small" x="328" y="232">authenticated action</text>

<rect class="violet" x="805" y="205" width="895" height="175" rx="17"/>
<text class="head" x="830" y="240">Asynchronous work is separated by human consequence</text>
<rect class="paper" x="830" y="265" width="94" height="78" rx="11"/><text class="small" x="877" y="292" text-anchor="middle">default</text><text class="small" x="877" y="315" text-anchor="middle">general</text>
<rect class="paper" x="939" y="265" width="94" height="78" rx="11"/><text class="small" x="986" y="292" text-anchor="middle">priority</text><text class="small" x="986" y="315" text-anchor="middle">interactive</text>
<rect class="paper" x="1048" y="265" width="94" height="78" rx="11"/><text class="small" x="1095" y="292" text-anchor="middle">validation</text><text class="small" x="1095" y="315" text-anchor="middle">evidence</text>
<rect class="paper" x="1157" y="265" width="94" height="78" rx="11"/><text class="small" x="1204" y="292" text-anchor="middle">draft</text><text class="small" x="1204" y="315" text-anchor="middle">generation</text>
<rect class="paper" x="1266" y="265" width="94" height="78" rx="11"/><text class="small" x="1313" y="292" text-anchor="middle">draft</text><text class="small" x="1313" y="315" text-anchor="middle">cache</text>
<rect class="paper" x="1375" y="265" width="94" height="78" rx="11"/><text class="small" x="1422" y="292" text-anchor="middle">approval</text><text class="small" x="1422" y="315" text-anchor="middle">bulk work</text>
<rect class="paper" x="1484" y="265" width="94" height="78" rx="11"/><text class="small" x="1531" y="292" text-anchor="middle">ingestion</text><text class="small" x="1531" y="315" text-anchor="middle">sources</text>
<rect class="paper" x="1593" y="265" width="82" height="78" rx="11"/><text class="small" x="1634" y="292" text-anchor="middle">check</text><text class="small" x="1634" y="315" text-anchor="middle">available</text>
<text class="small" x="830" y="365">Celery Beat schedules permitted work; feature flags provide an incident stop.</text>
<path class="async" d="M735 290H805"/><text class="small" x="743" y="277">enqueue</text>

<rect class="green" x="395" y="420" width="360" height="135" rx="16"/>
<text class="head" x="420" y="455">PostgreSQL 14</text><text class="body" x="420" y="482">operational system of record</text><text class="body" x="420" y="503">people • decisions • workflow state</text><text class="small" x="420" y="532">authority during suite transition</text>
<rect class="amber" x="805" y="420" width="260" height="135" rx="16"/>
<text class="head" x="830" y="455">MongoDB 7</text><text class="body" x="830" y="482">knowledge store</text><text class="small" x="830" y="512">recovery evidence incomplete</text>
<rect class="violet" x="1115" y="420" width="260" height="135" rx="16"/>
<text class="head" x="1140" y="455">Redis 7</text><text class="body" x="1140" y="482">broker/results: DB 0</text><text class="body" x="1140" y="503">Django cache: DB 1</text><text class="small" x="1140" y="532">must rebuild; never durable truth</text>
<rect class="slate" x="1425" y="420" width="250" height="135" rx="16"/>
<text class="head" x="1450" y="455">Bound file state</text><text class="body" x="1450" y="482">uploads • logs • static</text><text class="body" x="1450" y="503">test data under MAAS_DATA_ROOT</text><text class="small" x="1450" y="532">restore scope cannot ignore uploads</text>
<path class="data" d="M565 365V420"/><path class="data" d="M935 380V420"/><path class="data" d="M1245 380V420"/><path class="data" d="M1550 380V420"/>

<rect class="paper" x="58" y="645" width="1685" height="285" rx="20"/>
<text class="section" x="88" y="685">Suite and provider boundaries—meaning before transport</text>
<rect class="blue" x="90" y="730" width="205" height="135" rx="15"/><text class="head" x="115" y="765">MTLS</text><text class="body" x="115" y="791">approved training proof</text><text class="small" x="115" y="823">URL + API key + feature flag</text><text class="small" x="115" y="843">schema/owner still incomplete</text>
<rect class="violet" x="340" y="730" width="205" height="135" rx="15"/><text class="head" x="365" y="765">MSIS</text><text class="body" x="365" y="791">submission intelligence</text><text class="small" x="365" y="823">read-only shared-table transition</text>
<rect class="violet" x="590" y="730" width="205" height="135" rx="15"/><text class="head" x="615" y="765">MIIS</text><text class="body" x="615" y="791">interview intelligence</text><text class="small" x="615" y="823">read-only shared-table transition</text>
<rect class="rose" x="840" y="730" width="205" height="135" rx="15"/><text class="head" x="865" y="765">MCSS</text><text class="body" x="865" y="791">support issue intake</text><text class="small" x="865" y="823">API key • 10s timeout</text><text class="small" x="865" y="843">failed handoff remains visible</text>
<rect class="amber" x="1090" y="730" width="255" height="135" rx="15"/><text class="head" x="1115" y="765">OpenAI</text><text class="body" x="1115" y="791">resume/job assistance</text><text class="small" x="1115" y="823">separate model/canary controls</text><text class="small" x="1115" y="843">PII-safe request telemetry only</text>
<rect class="amber" x="1390" y="730" width="300" height="135" rx="15"/><text class="head" x="1415" y="765">Approved job sources / Apify</text><text class="body" x="1415" y="791">bounded external ingestion</text><text class="small" x="1415" y="823">tokens • feature gates • human review</text><text class="small" x="1415" y="843">untraceable job cannot advance</text>
<path class="external" d="M565 600C565 675 193 675 193 730"/><path class="data" d="M565 600C565 690 442 690 442 730"/><path class="data" d="M565 600C565 690 692 690 692 730"/><path class="risk" d="M565 600C565 675 942 675 942 730"/><path class="external" d="M1245 600C1245 675 1218 675 1218 730"/><path class="external" d="M1531 600V730"/>

<rect class="amber" x="58" y="975" width="1035" height="195" rx="20"/>
<text class="section" x="88" y="1015">A release is more than a green web page</text>
<text class="body" x="88" y="1050">reviewed revision + one image + migration set → pre-migration PostgreSQL backup → recreate web/workers/Beat</text>
<text class="body" x="88" y="1077">→ required queue topology → deep database/cache/media health → business-route smoke → human decision</text>
<text class="body" x="88" y="1114">Failure returns to the previous image. Schema rollback is not automatic; migration compatibility is a release invariant.</text>
<rect class="rose" x="88" y="1130" width="945" height="24" rx="9"/><text class="small" x="560" y="1147" text-anchor="middle">CURRENT RUNTIME, MONGODB/FILE RESTORE, ON-CALL ROUTE AND MEASURED RTO/RPO ARE NOT VERIFIED HERE</text>

<rect class="green" x="1138" y="975" width="605" height="195" rx="20"/>
<text class="section" x="1168" y="1015">Evidence must return to the journey</text>
<text class="body" x="1168" y="1050">release identity • web/worker topology • queue age • 5xx</text><text class="body" x="1168" y="1077">candidate/company/job/submission/interview success • integration errors</text><text class="body" x="1168" y="1104">backup + restore result • rollback result • reconciliation owner</text>
<path class="data" d="M1440 1170C1440 1210 190 1210 190 350"/>

<text class="human" x="58" y="1213">The architecture succeeds when a consultant’s journey remains explainable even when a queue, provider, integration or release fails.</text>
</svg>
