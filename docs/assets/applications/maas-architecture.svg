<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc" data-application="maas">
<title id="title">MAAS operational application architecture and suite handoffs</title>
<desc id="desc">A documentation-only architecture showing staff and consultants entering the MAAS Django application, operational decisions flowing through PostgreSQL, MongoDB, Redis and specialized Celery queues, suite handoffs to MTLS, MSIS, MIIS and MCSS, external provider boundaries, and the incomplete recovery and runtime evidence loop.</desc>
<defs>
<style>
.bg{fill:#f8fafc}.paper{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.amber{fill:#fff7ed;stroke:#d97706;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.slate{fill:#f1f5f9;stroke:#475569;stroke-width:2}.dash{fill:#fff;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.head{font:700 15px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.small{font:11px Arial,sans-serif;fill:#64748b}.human{font:italic 15px Georgia,serif;fill:#334155}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}.async{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#purpleArrow)}.data{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#greenArrow)}.external{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:8 5;marker-end:url(#orangeArrow)}.risk{fill:none;stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#redArrow)}
</style>
<marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#2563eb"/></marker>
<marker id="purpleArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#7c3aed"/></marker>
<marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#059669"/></marker>
<marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#d97706"/></marker>
