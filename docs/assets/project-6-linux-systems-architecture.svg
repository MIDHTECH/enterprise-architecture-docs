<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="980" viewBox="0 0 1650 980" role="img" aria-labelledby="title desc">
<title id="title">MidhHealth Linux Systems Platform Architecture</title>
<desc id="desc">Canonical Linux use cases delivered end to end through GitLab, Jenkins, Terraform and image automation, AWX and Ansible, runtime validation, convergence, recovery, and evidence.</desc>
<defs><style>
.bg{fill:#fff}.outer{fill:#f8fafc;stroke:#2563eb;stroke-width:3}.zone{fill:#fff;stroke:#2563eb;stroke-width:2.3;stroke-dasharray:8 6;rx:10}.panel{fill:#fff;stroke:#111827;stroke-width:2.2;rx:8}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}.green{fill:#ecfdf5;stroke:#15803d;stroke-width:2;rx:8}.amber{fill:#fffbeb;stroke:#b45309;stroke-width:2;rx:8}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:2;rx:8}.purple{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;rx:8}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.h1{font:700 20px Arial,sans-serif;fill:#0f172a}.h2{font:700 15px Arial,sans-serif;fill:#111827}.txt{font:13px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.ctrl{stroke:#6d28d9;stroke-width:3;fill:none;marker-end:url(#arrowP)}.data{stroke:#0284c7;stroke-width:3;fill:none;marker-end:url(#arrowB)}.evidence{stroke:#15803d;stroke-width:2.5;fill:none;stroke-dasharray:8 5;marker-end:url(#arrowG)}
</style>
