<rect class="bg" width="1650" height="980"/>
<text class="title" x="38" y="50">MidhHealth Linux Systems Platform Architecture</text>
<text class="txt" x="40" y="80">Canonical use cases: GitLab source gates → Jenkins approval → Terraform/image and AWX/Ansible execution → runtime, convergence, recovery, evidence.</text>
<rect class="outer" x="28" y="120" width="1594" height="620"/>
<rect class="zone" x="34" y="160" width="360" height="535"/>
<text class="h1" x="52" y="195">Managed Targets</text>
<rect class="zone" x="467" y="160" width="560" height="535"/>
<text class="h1" x="485" y="195">End-to-End IaC Delivery</text>
<rect class="zone" x="1100" y="160" width="460" height="535"/>
<text class="h1" x="1118" y="195">Acceptance Evidence</text>
<rect class="blue" x="52" y="205" width="295" height="64"/>
<text class="h2" x="70" y="233">infra01 / infra02 / infra03</text>
<text class="small" x="70" y="255">KVM, networks, pools and domains</text>
<rect class="green" x="52" y="291" width="295" height="64"/>
<text class="h2" x="70" y="319">Rocky and Ubuntu VMs</text>
<text class="small" x="70" y="341">platform, data and shared services</text>
<rect class="amber" x="52" y="377" width="295" height="64"/>
<text class="h2" x="70" y="405">Kubernetes Nodes</text>
<text class="small" x="70" y="427">container runtime and node classes</text>
<rect class="purple" x="52" y="463" width="295" height="64"/>
<text class="h2" x="70" y="491">Shared Services</text>
<text class="small" x="70" y="513">identity, observability, backup, storage</text>
<rect class="amber" x="485" y="205" width="220" height="64"/>
<text class="h2" x="503" y="233">GitLab Source Gates</text>
<text class="small" x="503" y="255">MR, lint, tests, policy, artifacts</text>
<rect class="purple" x="740" y="205" width="220" height="64"/>
<text class="h2" x="758" y="233">Jenkins Approval</text>
<text class="small" x="758" y="255">manual action and change approval</text>
<rect class="red" x="485" y="317" width="220" height="64"/>
<text class="h2" x="503" y="345">Terraform + Images</text>
<text class="small" x="503" y="367">VM, volume, network, cloud-init</text>
<rect class="blue" x="740" y="317" width="220" height="64"/>
<text class="h2" x="758" y="345">AWX + Ansible</text>
<text class="small" x="758" y="367">OS desired state, serial canary</text>
<rect class="blue" x="485" y="429" width="220" height="64"/>
<text class="h2" x="503" y="457">Security + Identity</text>
<text class="small" x="503" y="479">baseline, access, vuln, compliance</text>
<rect class="green" x="740" y="429" width="220" height="64"/>
<text class="h2" x="758" y="457">Observability + Recovery</text>
<text class="small" x="758" y="479">metrics, incidents, backup, DR/HA</text>
<rect class="green" x="1118" y="205" width="370" height="64"/>
<text class="h2" x="1136" y="233">Plan + Check Artifacts</text>
<text class="small" x="1136" y="255">SHA, runner, target and change set</text>
<rect class="amber" x="1118" y="291" width="370" height="64"/>
<text class="h2" x="1136" y="319">Runtime + SLO Health</text>
<text class="small" x="1136" y="341">services, consumers, logs and alerts</text>
<rect class="purple" x="1118" y="377" width="370" height="64"/>
<text class="h2" x="1136" y="405">Security + Compliance</text>
<text class="small" x="1136" y="427">access, vulnerabilities, exceptions</text>
<rect class="red" x="1118" y="463" width="370" height="64"/>
<text class="h2" x="1136" y="491">Convergence + Recovery</text>
<text class="small" x="1136" y="513">changed=0, rollback, restore, RTO</text>
