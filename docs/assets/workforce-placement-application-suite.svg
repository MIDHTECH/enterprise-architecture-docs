<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
<title id="title">Workforce and placement application suite journey</title>
<desc id="desc">A documentation-only architecture showing a candidate journey through separate MTAS, MTLS, MCIS, MJIS, MAAS, MSIS and MIIS application projects, with interview feedback returning to training and MCSS supporting source-evidenced applications. MAAS remains the operational record during transition.</desc>
<defs>
<style>
.bg{fill:#f8fafc}.paper{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.amber{fill:#fff7ed;stroke:#d97706;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.section{font:700 20px Arial,sans-serif;fill:#0f172a}.head{font:700 16px Arial,sans-serif;fill:#0f172a}.body{font:12px Arial,sans-serif;fill:#475569}.small{font:11px Arial,sans-serif;fill:#64748b}.human{font:italic 15px Georgia,serif;fill:#334155}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}.feedback{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#purpleArrow)}.record{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#greenArrow)}.support{fill:none;stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#redArrow)}
</style>
<marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#2563eb"/></marker>
<marker id="purpleArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#7c3aed"/></marker>
<marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#059669"/></marker>
<marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#e11d48"/></marker>
</defs>
<rect class="bg" width="1800" height="1160"/><rect class="paper" x="25" y="25" width="1750" height="1110" rx="22"/>
<text class="title" x="58" y="72">A candidate journey across eight independently owned applications</text>
<text class="sub" x="58" y="103">DOCUMENTATION / DISCOVERY VIEW — repository relationships are evidenced; interfaces and runtime states still require verification.</text>

<rect class="blue" x="58" y="150" width="235" height="170" rx="18"/>
<circle cx="112" cy="207" r="29" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="112" cy="196" r="8" fill="#2563eb"/><path d="M94 228Q112 209 130 228" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<text class="section" x="157" y="201">Candidate</text><text class="body" x="84" y="263">Needs a responsible path from</text><text class="body" x="84" y="284">intake to a placement outcome.</text>

<rect class="paper" x="335" y="140" width="1408" height="445" rx="20"/>
<text class="section" x="365" y="179">The decision journey—each project owns one promise</text>
<path class="flow" d="M293 235H375"/>

<rect class="blue" x="375" y="220" width="215" height="150" rx="15"/><text class="head" x="398" y="253">MTAS</text><text class="body" x="398" y="280">find + qualify candidate</text><text class="body" x="398" y="301">intake • consent • role fit</text><text class="small" x="398" y="337">owns entry into the journey</text>
<rect class="violet" x="640" y="220" width="215" height="150" rx="15"/><text class="head" x="663" y="253">MTLS</text><text class="body" x="663" y="280">close readiness gaps</text><text class="body" x="663" y="301">training • evidence • review</text><text class="small" x="663" y="337">owns training proof</text>
<rect class="amber" x="905" y="220" width="215" height="150" rx="15"/><text class="head" x="928" y="253">MCIS</text><text class="body" x="928" y="280">is this company suitable?</text><text class="body" x="928" y="301">policy • evidence • confidence</text><text class="small" x="928" y="337">owns company decision</text>
<rect class="amber" x="1170" y="220" width="215" height="150" rx="15"/><text class="head" x="1193" y="253">MJIS</text><text class="body" x="1193" y="280">is this job usable?</text><text class="body" x="1193" y="301">source • review • approval</text><text class="small" x="1193" y="337">owns job decision</text>
<rect class="green" x="1435" y="205" width="260" height="180" rx="16"/><text class="head" x="1458" y="240">MAAS operational workflow</text><text class="body" x="1458" y="269">consultant • company • job</text><text class="body" x="1458" y="290">submission • interview</text><line x1="1458" y1="310" x2="1670" y2="310" stroke="#6ee7b7"/><text class="small" x="1458" y="335">record authority during transition</text><text class="small" x="1458" y="355">market positioning + execution</text>
<path class="flow" d="M590 295H640"/><path class="flow" d="M855 295H905"/><path class="flow" d="M1120 295H1170"/><path class="flow" d="M1385 295H1435"/>
<text class="small" x="615" y="402" text-anchor="middle">readiness need</text><text class="small" x="880" y="402" text-anchor="middle">ready candidate</text><text class="small" x="1145" y="402" text-anchor="middle">company gate</text><text class="small" x="1410" y="402" text-anchor="middle">job decision</text>

<rect class="violet" x="720" y="425" width="245" height="120" rx="15"/><text class="head" x="743" y="458">MSIS</text><text class="body" x="743" y="484">submission outcome lens</text><text class="small" x="743" y="512">read-only transition mapping</text>
<rect class="violet" x="1025" y="425" width="245" height="120" rx="15"/><text class="head" x="1048" y="458">MIIS</text><text class="body" x="1048" y="484">interview feedback lens</text><text class="small" x="1048" y="512">read-only transition mapping</text>
<path class="record" d="M1530 385C1490 460 1325 482 1270 482"/><path class="record" d="M1480 385C1340 545 1020 545 965 490"/>
<path class="feedback" d="M1147 545C1147 650 748 650 748 370"/><text class="small" x="865" y="627">questions + outcomes return to the training decision</text>

<rect class="rose" x="335" y="635" width="1408" height="235" rx="20"/>
<text class="section" x="365" y="674">MCSS support loop—claim only the clients visible in source</text>
<rect class="paper" x="715" y="705" width="320" height="120" rx="16"/><text class="head" x="738" y="739">MCSS</text><text class="body" x="738" y="766">support issue lifecycle</text><text class="body" x="738" y="787">status • ownership • callback</text>
<rect class="blue" x="400" y="720" width="190" height="90" rx="14"/><text class="head" x="495" y="756" text-anchor="middle">MTAS</text><text class="small" x="495" y="779" text-anchor="middle">issue + signed callback</text>
<rect class="green" x="1160" y="720" width="190" height="90" rx="14"/><text class="head" x="1255" y="756" text-anchor="middle">MAAS</text><text class="small" x="1255" y="779" text-anchor="middle">issue client observed</text>
<rect class="violet" x="1400" y="720" width="190" height="90" rx="14"/><text class="head" x="1495" y="756" text-anchor="middle">MSIS</text><text class="small" x="1495" y="779" text-anchor="middle">issue + signed callback</text>
<path class="support" d="M590 765H715"/><path class="support" d="M1160 765H1035"/><path class="support" d="M1400 765H1035"/>
<text class="small" x="365" y="844">No MCSS edge is drawn for MTLS, MCIS, MJIS or MIIS because the audit did not find equivalent client source.</text>

<rect class="amber" x="58" y="925" width="1685" height="140" rx="18"/>
<text class="section" x="88" y="965">What turns these arrows into implementation-ready contracts later</text>
<text class="body" x="88" y="997">producer + consumer owner • versioned API/event/data schema • identity and consent • timeout/retry/idempotency • degraded user behavior</text>
<text class="body" x="88" y="1022">correlation fields • runtime evidence • rollback/reconciliation • recovery owner — all remain documentation gaps, not hidden assumptions.</text>
<text class="human" x="58" y="1107">The suite succeeds when the candidate experiences one coherent journey while every project can still explain the promise it owns.</text>
</svg>
