  <rect x="1" y="1" width="1678" height="1078" rx="14" class="canvas"/>
  <text x="42" y="50" class="title">MidhHealth Integrated Care Enterprise Architecture</text>
  <text x="42" y="78" class="subtitle">One provider-payer organization: hospital operations, digital care, claims, eligibility, authorizations, analytics, security, automation, and hybrid infrastructure.</text>

