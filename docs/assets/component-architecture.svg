      .runtime{fill:#fefce8;stroke:#ca8a04;stroke-width:2}
      .ops{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .data{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}
      .ai{fill:#fdf2f8;stroke:#db2777;stroke-width:2}
      .govern{fill:#f1f5f9;stroke:#475569;stroke-width:2}
      .appTarget{fill:#ffffff;stroke:#059669;stroke-width:1.6;stroke-dasharray:7 5}
      .runtimeTarget{fill:#ffffff;stroke:#ca8a04;stroke-width:1.6;stroke-dasharray:7 5}
      .dataTarget{fill:#ffffff;stroke:#7c3aed;stroke-width:1.6;stroke-dasharray:7 5}
