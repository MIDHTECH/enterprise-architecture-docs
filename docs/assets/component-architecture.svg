<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Ten-Project Enterprise Platform Portfolio</title>
  <desc id="desc">Ten implementation projects share a GitLab delivery control plane and on-premises runtime foundations; Projects 6-10 are active first slices on existing VMs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}.subtitle{font:15px Arial,sans-serif;fill:#475569}
      .head{font:700 17px Arial,sans-serif;fill:#0f172a}.label{font:700 14px Arial,sans-serif;fill:#0f172a}
      .small{font:12px Arial,sans-serif;fill:#475569}.active{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .planned{fill:#fffbeb;stroke:#d97706;stroke-width:2;stroke-dasharray:7 5}
      .shared{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.runtime{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="1398" height="858" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="58" class="title">Ten-Project Enterprise Platform Portfolio</text>
  <text x="60" y="86" class="subtitle">Role-centered architecture for DevOps, SRE, database, systems, data, and network engineering</text>

  <rect x="50" y="115" width="1300" height="90" rx="12" class="shared"/>
  <text x="700" y="146" text-anchor="middle" class="head">Shared GitLab Program and Delivery Control Plane</text>
  <text x="700" y="174" text-anchor="middle" class="small">Architecture docs • merge requests • protected branches • Jenkins • AWX/Ansible • Terraform • GitOps • evidence</text>

  <text x="60" y="245" class="head">Active implementation repositories</text>
  <rect x="50" y="265" width="244" height="122" rx="10" class="active"/>
  <text x="70" y="294" class="label">1 · DevSecOps CI/CD</text><text x="70" y="319" class="small">Build, test, scan, package,</text><text x="70" y="338" class="small">approve and deploy</text><text x="70" y="368" class="small">Active implementation</text>
  <rect x="314" y="265" width="244" height="122" rx="10" class="active"/>
  <text x="334" y="294" class="label">2 · Cloud Infrastructure</text><text x="334" y="319" class="small">Terraform, Ansible and</text><text x="334" y="338" class="small">environment foundations</text><text x="334" y="368" class="small">Active implementation</text>
  <rect x="578" y="265" width="244" height="122" rx="10" class="active"/>
  <text x="598" y="294" class="label">3 · Kubernetes GitOps</text><text x="598" y="319" class="small">Clusters, desired state, policy,</text><text x="598" y="338" class="small">ingress and workload delivery</text><text x="598" y="368" class="small">Active implementation</text>
  <rect x="842" y="265" width="244" height="122" rx="10" class="active"/>
  <text x="862" y="294" class="label">4 · Observability / SRE</text><text x="862" y="319" class="small">Metrics, logs, traces, alerts,</text><text x="862" y="338" class="small">SLOs and incident evidence</text><text x="862" y="368" class="small">Active implementation</text>
  <rect x="1106" y="265" width="244" height="122" rx="10" class="active"/>
  <text x="1126" y="294" class="label">5 · Governance / Ops</text><text x="1126" y="319" class="small">IAM, secrets, compliance,</text><text x="1126" y="338" class="small">backup, cost and remediation</text><text x="1126" y="368" class="small">Active implementation</text>

  <text x="60" y="435" class="head">Active first slices using existing VMs; no new VM, IP, or product allocation</text>
  <rect x="50" y="455" width="244" height="122" rx="10" class="active"/>
  <text x="70" y="484" class="label">6 · Linux Systems</text><text x="70" y="509" class="small">OS lifecycle, KVM, patching,</text><text x="70" y="528" class="small">storage, DNS and services</text><text x="70" y="558" class="small">Active first slice</text>
  <rect x="314" y="455" width="244" height="122" rx="10" class="active"/>
  <text x="334" y="484" class="label">7 · Database Reliability</text><text x="334" y="509" class="small">Lifecycle, performance, backup,</text><text x="334" y="528" class="small">recovery, security and upgrades</text><text x="334" y="558" class="small">Active first slice</text>
  <rect x="578" y="455" width="244" height="122" rx="10" class="active"/>
  <text x="598" y="484" class="label">8 · Resilience / Service Ops</text><text x="598" y="509" class="small">SLOs, incidents, capacity,</text><text x="598" y="528" class="small">performance, chaos and DR</text><text x="598" y="558" class="small">Active first slice</text>
  <rect x="842" y="455" width="244" height="122" rx="10" class="active"/>
  <text x="862" y="484" class="label">9 · Data Engineering</text><text x="862" y="509" class="small">Ingestion, orchestration, quality,</text><text x="862" y="528" class="small">lineage and lakehouse patterns</text><text x="862" y="558" class="small">Active first slice</text>
  <rect x="1106" y="455" width="244" height="122" rx="10" class="active"/>
  <text x="1126" y="484" class="label">10 · Network Engineering</text><text x="1126" y="509" class="small">IPAM, DNS/DHCP, routing, VPN,</text><text x="1126" y="528" class="small">firewalls, cloud and K8s network</text><text x="1126" y="558" class="small">Active first slice</text>

  <path d="M700 205V246" class="flow"/>
  <path d="M700 205V418" class="dash"/>
  <rect x="50" y="650" width="1300" height="150" rx="12" class="runtime"/>
  <text x="700" y="682" text-anchor="middle" class="head">Shared On-Premises Foundations</text>
  <text x="180" y="724" text-anchor="middle" class="label">Access</text><text x="180" y="748" text-anchor="middle" class="small">BIND DNS • NGINX</text><text x="180" y="768" text-anchor="middle" class="small">internal URLs and TLS target</text>
  <text x="445" y="724" text-anchor="middle" class="label">Compute</text><text x="445" y="748" text-anchor="middle" class="small">infra01 / infra02 • KVM</text><text x="445" y="768" text-anchor="middle" class="small">Rocky Linux 9 VMs</text>
  <text x="700" y="724" text-anchor="middle" class="label">Platform</text><text x="700" y="748" text-anchor="middle" class="small">Kubernetes • Harbor • Artifactory</text><text x="700" y="768" text-anchor="middle" class="small">GitLab • Jenkins • AWX</text>
  <text x="965" y="724" text-anchor="middle" class="label">Operations</text><text x="965" y="748" text-anchor="middle" class="small">Prometheus • Grafana • Loki</text><text x="965" y="768" text-anchor="middle" class="small">Tempo • Elastic • Splunk target</text>
  <text x="1220" y="724" text-anchor="middle" class="label">Future Cloud</text><text x="1220" y="748" text-anchor="middle" class="small">AWS EKS / ECR validation</text><text x="1220" y="768" text-anchor="middle" class="small">explicitly deferred</text>
  <path d="M700 387V630" class="flow"/>
  <path d="M700 577V630" class="dash"/>
  <text x="60" y="835" class="small">Solid green = active implementation or active first slice • dashed paths = future expansion • lab has no infrastructure HA</text>
</svg>
