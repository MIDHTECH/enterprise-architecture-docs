<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">MidhHealth Integrated Care Enterprise Architecture</title>
  <desc id="desc">Connected enterprise architecture separating accepted current platform foundations from reference application capabilities and planned cloud, data, AI, MLOps, and GitOps targets for MidhHealth Integrated Care.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#059669"/>
    </marker>
    <style>
