name: Validate enterprise architecture documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v4
      - name: Validate design, traceability, links, and generated content
        run: ./scripts/local-validate.sh
